  function backupData() {
    var u = unsavedState || {}, d = new Date();
    var data = { app: 'chaveiro', versao: 2, criadoEm: d.toISOString(), savedAt: Number(lsGet(STORAGE_SAVEDAT)) || Date.now(),
      vendas: u[STORAGE_VENDAS] || loadVendas(), despesas: u[STORAGE_DESPESAS] || loadDespesas(), estoque: u[STORAGE_ESTOQUE] || loadEstoque(),
      meta: u[STORAGE_META] != null ? Number(u[STORAGE_META]) || 0 : loadMeta() };
    var q = loadQuarantine(); if (q.length) data.quarentena = q;
    return data;
  }
  function fazerBackup() {
    var d = new Date();
    baixarArquivo('chaveiro-backup-' + dayKey(d) + '.json', JSON.stringify(backupData()));
    groupOpen._backup = dayKey(d); saveUi();
    renderApp(); setBackupMsg('Backup salvo na pasta de downloads.');
  }
  // Restaura um backup JUNTANDO com os dados atuais (nada local é apagado). Registros ilegíveis são
  // ignorados (o arquivo de backup continua intacto); baterias/pilhas ainda zeradas recebem as quantidades do backup.
  function restaurarBackup(file) {
    var r = new FileReader();
    r.onload = function () {
      var data;
      try { data = JSON.parse(r.result); } catch (e) { data = null; }
      if (!isObj(data) || !(Array.isArray(data.vendas) || Array.isArray(data.despesas) || Array.isArray(data.estoque))) { setBackupMsg('Esse arquivo não parece ser um backup do Chaveiro. Nada foi alterado.'); return; }
      try {
        var inc = sanitizeData(data), m = mergeData(localData(), inc), st = m.st;
        if (!commit(dataMap(m.vendas, m.despesas, m.estoque, m.meta))) { setBackupMsg('Não foi possível restaurar: o navegador não conseguiu salvar. Nada foi alterado.'); return; }
        renderApp();
        var msg = 'Backup restaurado: ' + st.nv + ' vendas, ' + st.nd + ' gastos e ' + st.ne + ' produtos adicionados' + (st.ng ? '; ' + st.ng + ' baterias/pilhas atualizadas' : '') + '.';
        if (st.conf) msg += ' ' + st.conf + ' registro(s) já existiam aqui com conteúdo diferente e foram mantidos como estão neste navegador.';
        if (st.dup) msg += ' ' + st.dup + ' produto(s) já existiam com o mesmo nome e não foram duplicados.';
        if (inc.bad) msg += ' ' + inc.bad + ' registro(s) ilegível(is) do backup foram ignorados.';
        setBackupMsg(msg);
      } catch (e) { setBackupMsg('Não foi possível ler esse backup. Nada foi alterado.'); }
    };
    r.onerror = function () { setBackupMsg('Não foi possível abrir esse arquivo. Nada foi alterado.'); };
    r.readAsText(file);
  }
  function bindBackup() {
    var f = document.getElementById('restoreFile');
    document.getElementById('backupBtn').addEventListener('click', fazerBackup);
    document.getElementById('restoreBtn').addEventListener('click', function () { f.click(); });
    f.addEventListener('change', function () { if (f.files[0]) restaurarBackup(f.files[0]); });
  }

  function renderResumo() {
    var mKey = viewMonth, monthDate = new Date(+mKey.slice(0, 4), +mKey.slice(5, 7) - 1, 1);
    document.getElementById('monthLabel').textContent = monthDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    document.getElementById('nextMonth').disabled = mKey >= todayKey().slice(0, 7);

    var vendas = salesOfMonth(mKey);
    var despesas = expOfMonth(mKey);

    var totalBruto = money(vendas.reduce(function (s, v) { return s + v.subtotal; }, 0));
    var totalDesconto = money(vendas.reduce(function (s, v) { return s + v.discount; }, 0));
    var totalLiquido = money(vendas.reduce(function (s, v) { return s + v.total; }, 0));

    var porCategoria = {};
    CATEGORIES.forEach(function (c) { porCategoria[c.id] = { qty: 0, valor: 0, label: c.label }; });
    vendas.forEach(function (v) { v.items.forEach(function (it) {
      var k = it.cat === 'estoque' ? 'p:' + it.pid : it.cat;
      if (!porCategoria[k]) porCategoria[k] = { qty: 0, valor: 0, label: itemName(it) };
      porCategoria[k].qty += it.qty; porCategoria[k].valor = money(porCategoria[k].valor + it.qty * it.unitPrice);
    }); });

    var totalDespesas = money(despesas.reduce(function (s, e) { return s + (num(e.valor) || 0); }, 0));
    var despesaPorCategoria = {};
    EXPENSE_CATEGORIES.forEach(function (c) { despesaPorCategoria[c.id] = 0; });
    despesas.forEach(function (e) { despesaPorCategoria[e.cat] = (despesaPorCategoria[e.cat] || 0) + (num(e.valor) || 0); });

    var saldo = money(totalLiquido - totalDespesas);

    var vendasKeys = Object.keys(porCategoria).filter(function (k) { return porCategoria[k].qty > 0; });
    var vendasRows = capList('vendasmes-' + mKey, vendasKeys, 5, function (k) {
      var v = porCategoria[k];
      return '<div class="totals-row"><span>' + escAttr(v.qty) + 'x ' + escAttr(v.label) + '</span><span>' + brl(v.valor) + '</span></div>';
    });
    var expKeys = EXPENSE_CATEGORIES.map(function (c) { return c.id; });
    Object.keys(despesaPorCategoria).forEach(function (k) { if (expKeys.indexOf(k) < 0) expKeys.push(k); });
    var despesasRows = expKeys.map(function (k) {
      var val = despesaPorCategoria[k];
      if (!val) return '';
      return '<div class="totals-row"><span>' + escAttr(expCatLabel(k)) + '</span><span>' + brl(money(val)) + '</span></div>';
    }).join('');

    var html = '<div class="card card-wide resumo-strip"><div><small>Vendas do mês (líquido)</small><b>' + brl(totalLiquido) + '</b></div><div><small>Gastos do mês</small><b>' + brl(totalDespesas) + '</b></div>' +
      '<div class="saldo' + (saldo < 0 ? ' neg' : '') + '"><small>Saldo do mês</small><b>' + brl(saldo) + '</b></div></div>';
    html += chartsHtml(mKey);
    html += '<div class="card"><div class="card-title">Vendas do mês</div>' +
      (vendasRows || '<div class="empty">Nenhuma venda neste mês.</div>') +
      '<div class="totals-row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px;"><span>Total bruto</span><span>' + brl(totalBruto) + '</span></div>' +
      (totalDesconto > 0 ? '<div class="totals-row"><span>Descontos</span><span>' + brl(totalDesconto) + '</span></div>' : '') +
      '<div class="totals-row" style="font-weight:700;"><span>Total líquido</span><span>' + brl(totalLiquido) + '</span></div></div>';
    html += '<div class="card"><div class="card-title">Gastos do mês</div>' +
      (despesasRows || '<div class="empty">Nenhum gasto neste mês.</div>') +
      '<div class="totals-row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;"><span>Total de gastos</span><span>' + brl(totalDespesas) + '</span></div></div>';
    html += resumoExtras(vendas, porCategoria);
    html += '<div class="footer-actions"><button class="registrar-btn" id="exportBtn" style="width:auto;padding:12px 22px;">Baixar relatório do mês (Excel/CSV)</button></div>' +
      '<div class="export-msg" id="exportMsg"></div>';
    html += backupCardHtml();

    document.getElementById('resumoContent').innerHTML = html;
    var exportBtn = document.getElementById('exportBtn');
    if (exportBtn) exportBtn.addEventListener('click', function () { exportarMes(mKey, vendas, despesas, totalBruto, totalDesconto, totalLiquido, totalDespesas, saldo); });
    bindBackup(); bindReceber(); bindShowMore();
  }

  function renderApp() {
    ensureGroupStock();
    var estBadge = document.getElementById('estBadge');
    if (estBadge) { var lowN = estIndex().low.length; estBadge.textContent = lowN; estBadge.style.display = lowN > 0 ? 'inline-block' : 'none'; }
    document.querySelectorAll('.tab-btn').forEach(function (btn) { btn.classList.toggle('active', btn.getAttribute('data-tab') === currentTab); });
    document.getElementById('dayNav').style.display = (currentTab === 'resumo' || currentTab === 'estoque') ? 'none' : 'flex';
    document.getElementById('monthNav').style.display = (currentTab === 'resumo') ? 'flex' : 'none';
    document.getElementById('vendasSection').style.display = currentTab === 'vendas' ? 'block' : 'none';
    document.getElementById('despesasSection').style.display = currentTab === 'despesas' ? 'block' : 'none';
    document.getElementById('resumoSection').style.display = currentTab === 'resumo' ? 'block' : 'none';
    document.getElementById('estoqueSection').style.display = currentTab === 'estoque' ? 'block' : 'none';
    if (currentTab === 'vendas') { renderSaleForm(); renderHistoryAndTotal(); setupClearVendas(); }
    else if (currentTab === 'despesas') { renderExpenseForm(); renderExpenseHistoryAndTotal(); setupClearExp(); }
    else if (currentTab === 'resumo') { renderResumo(); }
    else if (currentTab === 'estoque') { renderEstoque(); }
    renderDataBar();
  }

  document.querySelectorAll('.tab-btn').forEach(function (btn) { btn.addEventListener('click', function () { currentTab = btn.getAttribute('data-tab'); renderApp(); }); });
  var histSearchEl = document.getElementById('histSearch');
  var histTimer = null; // debounce: a busca percorre todo o histórico
  if (histSearchEl) histSearchEl.addEventListener('input', function () { clearTimeout(histTimer); histTimer = setTimeout(renderHistoryAndTotal, 150); });
  // Outra aba alterou os dados: descarta o cache daquela lista e redesenha.
  window.addEventListener('storage', function (ev) {
    if (ev.key === null || isListKey(ev.key)) { invalidateCache(ev.key); renderApp(); }
    else if (ev.key === STORAGE_META) renderApp();
  });
  function goToDay(k) { var t = todayKey(); if (k > t) k = t; viewDay = k; followToday = k === t; dayRolled = false; renderApp(); }
  document.getElementById('prevDay').addEventListener('click', function () { goToDay(addDays(viewDay, -1)); });
  document.getElementById('nextDay').addEventListener('click', function () { if (viewDay < todayKey()) goToDay(addDays(viewDay, 1)); });
  document.getElementById('prevMonth').addEventListener('click', function () { viewMonth = addMonths(viewMonth, -1); renderApp(); });
  document.getElementById('nextMonth').addEventListener('click', function () { if (viewMonth < todayKey().slice(0, 7)) { viewMonth = addMonths(viewMonth, 1); renderApp(); } });
  // Cabeçalho do dia: rótulo, "HOJE", botão "próximo" e o aviso de virada de dia.
  function updateDayUI() {
    var t = todayKey(), isToday = viewDay === t;
    document.getElementById('dateLabel').textContent = fmtDayLong(viewDay);
    document.getElementById('todayTag').textContent = isToday ? 'HOJE' : '';
    document.getElementById('nextDay').disabled = viewDay >= t;
    var w = document.getElementById('dayWarn');
    if (w) {
      var show = !isToday && dayRolled && (currentTab === 'vendas' || currentTab === 'despesas');
      w.hidden = !show;
      if (show) { w.innerHTML = '⚠ O dia virou: hoje é <b>' + escAttr(fmtDayLong(t)) + '</b>. Esta tela continua em <b>' + escAttr(fmtDayLong(viewDay)) + '</b> — o que você registrar aqui vai para esse dia. <button type="button" id="goTodayBtn">Ir para hoje</button>'; document.getElementById('goTodayBtn').onclick = function () { goToDay(todayKey()); }; }
    }
    var hl = document.getElementById('heroLbl'); if (hl) hl.textContent = isToday ? 'Faturamento de hoje' : 'Faturamento de ' + fmtDayMed(viewDay);
    var rb = document.getElementById('registrarBtn'); if (rb && !editingSaleId) rb.textContent = isToday ? 'Registrar venda' : 'Registrar venda em ' + fmtDM(viewDay);
    var gb = document.getElementById('registrarGastoBtn'); if (gb && !editingExpId) gb.textContent = isToday ? 'Registrar gasto' : 'Registrar gasto em ' + fmtDM(viewDay);
  }
  // Virada do dia com o app aberto: NÃO muda o dia selecionado; só atualiza rótulos e avisa (B18).
  function checkDayChange() {
    var t = todayKey(); if (t === lastToday) return;
    var prev = lastToday; lastToday = t;
    if (followToday && viewDay === prev) dayRolled = true;
    if (currentTab === 'vendas' || currentTab === 'despesas') updateDayUI();
    else if (currentTab === 'resumo') { var nm = document.getElementById('nextMonth'); if (nm) nm.disabled = viewMonth >= t.slice(0, 7); }
  }
  setInterval(checkDayChange, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDayChange(); });

  function setupClear(footerId, btnId, btnLabel, msg, chkId, yesId, doClear) {
    var footer = document.getElementById(footerId);
    var again = function () { setupClear(footerId, btnId, btnLabel, msg, chkId, yesId, doClear); };
    footer.innerHTML = '<button class="clear-btn" id="' + btnId + '">' + btnLabel + '</button>';
    document.getElementById(btnId).addEventListener('click', function () {
      footer.innerHTML = '<div class="confirm-bar" style="flex-direction:column;align-items:stretch;">' +
        '<span>' + msg + '</span>' +
        '<label><input type="checkbox" id="' + chkId + '"> Sim, tenho certeza que quero apagar</label>' +
        '<span class="cbtns" style="justify-content:flex-end;"><button class="no">Cancelar</button><button class="yes" id="' + yesId + '" disabled>Apagar tudo</button></span></div>';
      document.getElementById(chkId).addEventListener('change', function (ev) { document.getElementById(yesId).disabled = !ev.target.checked; });
      footer.querySelector('.no').addEventListener('click', again);
      document.getElementById(yesId).addEventListener('click', function () { doClear(viewDay); renderApp(); });
    });
  }
  function setupClearVendas() {
    setupClear('footerActions', 'clearBtn', 'Limpar vendas do dia', 'Isso vai apagar TODAS as vendas registradas neste dia (o estoque delas volta). Logo depois aparece um aviso com o botão "Desfazer", caso tenha sido engano.', 'confirmClearVendas', 'confirmClearVendasBtn',
      function (key) {
        var all = loadVendas(), es = loadEstoque().slice(), gone = all.filter(function (e) { return e.day === key; });
        gone.forEach(function (s) { applyStock(es, s, 1); });
        if (!commit(dataMap(all.filter(function (e) { return e.day !== key; }), null, es))) return;
        setUndo(gone.map(function (s) { return { before: s, after: null }; })); showToast('Vendas do dia apagadas', true);
      });
  }
  function setupClearExp() {
    setupClear('expFooterActions', 'clearExpBtn', 'Limpar gastos do dia', 'Isso vai apagar TODOS os gastos registrados neste dia. Isso NÃO pode ser desfeito.', 'confirmClearDespesas', 'confirmClearDespesasBtn',
      function (key) { if (saveDespesas(loadDespesas().filter(function (e) { return e.day !== key; }))) showToast('Gastos do dia apagados'); });
  }

  // Escolher um dia específico
  var datePick = document.getElementById('datePick');
  document.getElementById('dateBtn').addEventListener('click', function () {
    datePick.max = todayKey();
    datePick.value = viewDay;
    try { datePick.showPicker(); } catch (e) { datePick.focus(); }
  });
  datePick.addEventListener('change', function () {
    if (!datePick.value) return;
    if (!validDay(datePick.value)) return;
    goToDay(datePick.value); // valor 'AAAA-MM-DD' usado direto: sem conversão de fuso horário
  });

  // Escolher um mês específico
  var MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  var pickYear = 0;
  var monthPop = document.getElementById('monthPop');
  function renderMonthPop() {
    var now = new Date(), cur = new Date(+viewMonth.slice(0, 4), +viewMonth.slice(5, 7) - 1, 1);
    var h = '<div class="myear"><button data-y="-1">‹</button><b>' + pickYear + '</b><button data-y="1"' + (pickYear >= now.getFullYear() ? ' disabled' : '') + '>›</button></div><div class="mgrid">';
    MESES.forEach(function (m, i) {
      var future = pickYear > now.getFullYear() || (pickYear === now.getFullYear() && i > now.getMonth());
      var sel = pickYear === cur.getFullYear() && i === cur.getMonth();
      h += '<button data-m="' + i + '"' + (future ? ' disabled' : '') + (sel ? ' class="sel"' : '') + '>' + m + '</button>';
    });
    monthPop.innerHTML = h + '</div>';
  }
  document.getElementById('monthBtn').addEventListener('click', function () {
    if (monthPop.hidden) { pickYear = +viewMonth.slice(0, 4); renderMonthPop(); monthPop.hidden = false; }
    else { monthPop.hidden = true; }
  });
  monthPop.addEventListener('click', function (ev) {
    ev.stopPropagation();
    var b = ev.target.closest('button');
    if (!b || b.disabled) return;
    if (b.getAttribute('data-y')) { pickYear += parseInt(b.getAttribute('data-y'), 10); renderMonthPop(); }
    else if (b.getAttribute('data-m')) {
      viewMonth = pickYear + '-' + String(parseInt(b.getAttribute('data-m'), 10) + 1).padStart(2, '0');
      monthPop.hidden = true;
      renderApp();
    }
  });
  document.addEventListener('click', function (ev) { if (!ev.target.closest('#monthBtn')) monthPop.hidden = true; });

  (function () {
    document.getElementById('saleTotalsWrap').addEventListener('click', function (ev) {
      var b = ev.target.closest('.sl-btn'); if (!b) return;
      var d = b.classList.contains('sl-plus') ? 1 : -1, sp = b.getAttribute('data-sp'), sc = b.getAttribute('data-sc'), so = b.getAttribute('data-so');
      // Mesmo caminho dos botões do formulário: atualiza só o bloco afetado + totais.
      if (b.hasAttribute('data-so-del')) { outrosList.splice(+b.getAttribute('data-so-del'), 1); refreshOutros(); return; }
      if (so !== null && outrosList[+so]) { outrosList[+so].qty = Math.max(1, outrosList[+so].qty + d); refreshOutros(); } // "−" nunca remove: remover é só no 🗑
      else if (sp && stockItems[sp]) changeStock(sp, d);
      else if (sc && itemState[sc]) changeCat(sc, d);
    });
  })();
  document.addEventListener('click', function (ev) {
    if (!ev.target.closest('[data-goal]')) return;
    var cur = loadMeta(), v = prompt('Meta de faturamento mensal (R$) — é um valor só, usado em todos os meses:', cur ? String(cur).replace('.', ',') : '');
    if (v === null) return;
    var n = parseMoney(v.trim() === '' ? '0' : v);
    if (isNaN(n) || n < 0) { showToast('Meta inválida. Digite só o número, ex: 20000 ou 20.000.', false, true); return; }
    if (saveMeta(n)) renderApp();
  });
  // A navegação de dia/mês fica dentro do header: a área fixa no topo é só a altura real do header.
  function syncStickyOffsets() {
    var h = document.querySelector('header');
    document.documentElement.style.setProperty('--stick-top', (h ? h.offsetHeight : 0) + 'px');
  }
  window.addEventListener('resize', syncStickyOffsets);
  window.addEventListener('load', syncStickyOffsets);
  if (window.ResizeObserver) { var hd = document.querySelector('header'); if (hd) new ResizeObserver(syncStickyOffsets).observe(hd); }
  // sem ResizeObserver (navegadores antigos): recalcula ao trocar de aba (a navegação de dia aparece/some)
  else document.querySelectorAll('.tab-btn').forEach(function (b) { b.addEventListener('click', function () { setTimeout(syncStickyOffsets, 0); }); });
  // Atalhos de teclado (balcão com teclado): Alt+1..4 troca de aba; "/" vai para a busca da aba;
  // Ctrl+Enter registra a venda/gasto em andamento. Nada acontece com um aviso (modal) aberto.
  var TABS = ['vendas', 'estoque', 'despesas', 'resumo'];
  document.querySelectorAll('.tab-btn').forEach(function (b) { b.title = 'Alt+' + (TABS.indexOf(b.getAttribute('data-tab')) + 1); });
  document.addEventListener('keydown', function (ev) {
    var m = document.getElementById('modal'); if (m && !m.hidden) return;
    var t = ev.target, typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
    var n = /^Digit[1-4]$/.test(ev.code) ? +ev.code.slice(5) : 0;
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && n) { ev.preventDefault(); var tb = document.querySelector('.tab-btn[data-tab="' + TABS[n - 1] + '"]'); if (tb) tb.click(); return; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') {
      var rb = document.getElementById(currentTab === 'vendas' ? 'registrarBtn' : currentTab === 'despesas' ? 'registrarGastoBtn' : '');
      if (rb && !rb.disabled) { ev.preventDefault(); rb.click(); }
      return;
    }
    if (ev.key === '/' && !typing && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      var se = document.getElementById(currentTab === 'vendas' ? 'histSearch' : currentTab === 'estoque' ? 'estSearch' : '');
      if (se) { ev.preventDefault(); se.focus(); se.select(); }
    }
  });
  // Seletores de dia/mês também pelo teclado (Enter/Espaço).
  ['dateBtn', 'monthBtn'].forEach(function (id) { var el = document.getElementById(id); if (el) el.addEventListener('keydown', function (ev) { if (ev.target === el && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); el.click(); } }); });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  renderApp();
  syncStickyOffsets();
  initFile();
})();
</script>
</body>
