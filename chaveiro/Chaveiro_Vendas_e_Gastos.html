<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaveiro — Vendas e Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDE6D6; --bg-elevated: #F8F3E8; --ink: #26241F; --ink-soft: #756D5B;
    --brass: #A97C3B; --brass-strong: #8B5E2A; --brass-wash: #E9D9BC;
    --steel: #837A66; --line: #DCD1B6; --danger: #A6432A;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1815; --bg-elevated: #242019; --ink: #EDE6D6; --ink-soft: #B7AD97;
      --brass: #D3A45F; --brass-strong: #E6B871; --brass-wash: #3A2F1F;
      --steel: #9C9280; --line: #38332A; --danger: #E08869;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1815; --bg-elevated: #242019; --ink: #EDE6D6; --ink-soft: #B7AD97;
    --brass: #D3A45F; --brass-strong: #E6B871; --brass-wash: #3A2F1F;
    --steel: #9C9280; --line: #38332A; --danger: #E08869;
  }
  * { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 1200px; margin: 0 auto; min-height: 100%; }

  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px;
  }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.5rem; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-soft); font-size: 0.88rem; margin: 0; }

  .tabbar { display: flex; gap: 8px; width: 100%; max-width: 480px; }
  .tab-btn {
    flex: 1; padding: 10px 6px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg-elevated); color: var(--ink-soft); font-weight: 600; font-size: 0.85rem;
    cursor: pointer; font-family: inherit;
  }
  .tab-btn.active { background: var(--brass); color: #fff; border-color: var(--brass); }

  .daynav { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 4px; gap: 10px; }
  .daynav button {
    border: 1px solid var(--line); background: var(--bg-elevated); color: var(--ink);
    width: 38px; height: 38px; border-radius: 10px; font-size: 1.1rem; cursor: pointer;
  }
  .daynav button:disabled { opacity: 0.35; cursor: default; }
  .daylabel { text-align: center; flex: 1; }
  .daylabel .date { font-weight: 600; font-size: 0.98rem; text-transform: capitalize; }
  .daylabel .tag { display: inline-block; margin-top: 2px; font-size: 0.72rem; color: var(--brass-strong); font-weight: 600; letter-spacing: 0.02em; }

  .totalbar {
    margin: 12px 20px 0; padding: 12px 16px; background: var(--bg-elevated);
    border: 1px solid var(--line); border-radius: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .totalbar .t-label { color: var(--ink-soft); font-size: 0.85rem; }
  .totalbar .t-count { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.25rem; }

  .card {
    margin: 16px 20px 0; background: var(--bg-elevated); border: 1px solid var(--line);
    border-radius: 18px; padding: 6px 16px 16px;
  }
  .card-title { font-weight: 600; font-size: 0.95rem; padding: 12px 0 4px; }

  .item-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); gap: 10px; flex-wrap: wrap; }
  .item-row:last-of-type { border-bottom: none; }
  .item-info { display: flex; flex-direction: column; gap: 2px; }
  .item-label { font-weight: 600; font-size: 0.94rem; }
  .item-price { font-size: 0.78rem; color: var(--ink-soft); }

  .stepper { display: flex; align-items: center; gap: 10px; }
  .step-btn {
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 1.15rem; cursor: pointer;
  }
  .step-btn:active { background: var(--brass-wash); }
  .step-count { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.1rem; min-width: 20px; text-align: center; }

  .extra-fields { width: 100%; display: flex; gap: 10px; padding-top: 2px; flex-wrap: wrap; }
  .field-wrap { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 130px; }
  .field-wrap label { font-size: 0.74rem; color: var(--ink-soft); }
  .field-wrap .money-input { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 10px; }
  .field-wrap .money-input span { font-size: 0.85rem; color: var(--ink-soft); margin-right: 4px; }
  .field-wrap input {
    border: none; background: none; color: var(--ink); font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem; padding: 9px 0; width: 100%; outline: none;
  }
  .field-wrap input.text-input { font-family: 'IBM Plex Sans', sans-serif; }
  .field-wrap.invalid .money-input { border-color: var(--danger); }
  .hint { font-size: 0.72rem; color: var(--danger); }
  .select-input {
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
    padding: 9px 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 0.92rem; width: 100%; outline: none;
  }

  .totals-card { margin: 16px 20px 0; background: var(--bg-elevated); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
  .totals-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 0.92rem; }
  .totals-row.discount-row input {
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', monospace; padding: 6px 8px; width: 90px; text-align: right; outline: none;
  }
  .totals-row.total-row { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 12px; font-weight: 700; font-size: 1.1rem; }
  .totals-row.total-row .val { font-family: 'JetBrains Mono', monospace; }

  .registrar-btn {
    width: 100%; margin-top: 12px; padding: 13px; border: none; border-radius: 12px;
    background: var(--brass); color: #fff; font-weight: 600; font-size: 0.98rem; cursor: pointer; font-family: inherit;
  }
  .registrar-btn:disabled { background: var(--line); color: var(--ink-soft); cursor: default; }

  .section-title { padding: 22px 20px 6px; font-size: 0.8rem; color: var(--ink-soft); font-weight: 600; }

  .history { padding: 0 20px 28px; }
  .sale-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px; border-bottom: 1px solid var(--line); gap: 10px; }
  .sale-item .s-left { display: flex; flex-direction: column; gap: 2px; }
  .sale-item .s-time { font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; color: var(--ink-soft); }
  .sale-item .s-desc { font-size: 0.9rem; }
  .sale-item .s-discount { font-size: 0.74rem; color: var(--brass-strong); }
  .sale-item .s-right { display: flex; align-items: center; gap: 10px; }
  .sale-item .s-total { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.98rem; }
  .sale-item .s-del { border: none; background: none; color: var(--steel); font-size: 1rem; padding: 6px 8px; cursor: pointer; border-radius: 8px; }
  .sale-item .s-del:active { background: var(--brass-wash); color: var(--danger); }
  .empty { color: var(--ink-soft); font-size: 0.9rem; padding: 18px 2px; text-align: center; }

  .footer-actions { padding: 6px 20px 32px; display: flex; justify-content: center; }
  .clear-btn { border: 1px solid var(--line); background: none; color: var(--ink-soft); font-size: 0.82rem; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-family: inherit; }
  .confirm-bar {
    margin: 0 20px 24px; padding: 12px 14px; background: var(--bg-elevated); border: 1px solid var(--danger);
    border-radius: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.85rem;
  }
  .confirm-bar .cbtns { display: flex; gap: 8px; }
  .confirm-bar button { border: none; padding: 7px 12px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; font-family: inherit; }
  .confirm-bar .yes { background: var(--danger); color: #fff; }
  .confirm-bar .no { background: var(--line); color: var(--ink); }
  .confirm-bar button:disabled { opacity: 0.4; cursor: default; }
  .confirm-bar label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
  .s-confirm-text { font-size: 0.78rem; color: var(--danger); }
  .s-confirm-btn { border: none; padding: 5px 10px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; font-family: inherit; }
  .s-confirm-btn.yes { background: var(--danger); color: #fff; }
  .s-confirm-btn.no { background: var(--line); color: var(--ink); }

  .export-msg { text-align: center; font-size: 0.82rem; color: var(--ink-soft); padding: 0 20px 20px; }
  .daynav { max-width: 520px; margin-left: auto; margin-right: auto; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
  .cols.single { grid-template-columns: minmax(0, 1fr); }
  .cols.single > .col:first-child { display: none; }
  .cols .totalbar { margin-top: 16px; }
  #resumoContent { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  #resumoContent .totals-card, #resumoContent .footer-actions, #resumoContent .export-msg { grid-column: 1 / -1; }
  .picker { position: relative; cursor: pointer; border-radius: 10px; padding: 2px 8px; user-select: none; }
  .picker:hover { background: var(--brass-wash); }
  .picker .date::after { content: ' ▾'; font-size: 0.75em; color: var(--ink-soft); }
  .picker input { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; opacity: 0; border: 0; padding: 0; pointer-events: none; }
  .mpop { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); z-index: 20; width: 260px; padding: 12px; cursor: default;
    background: var(--bg-elevated); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
  .myear { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mpop button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
  .mpop button.sel { background: var(--brass); color: #fff; border-color: var(--brass); }
  .mpop button:disabled { opacity: 0.35; cursor: default; }
  @media (max-width: 860px) { .cols, #resumoContent { grid-template-columns: minmax(0, 1fr); } }
  @media (max-height: 800px) { header { padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; } h1 { font-size: 1.3rem; } .daynav { padding-top: 8px; } .item-row { padding: 9px 0; } }
  @media (min-width: 861px) {
    #history, #expHistory { max-height: calc(100vh - 460px); overflow-y: auto; padding-right: 6px; }
    #estList { max-height: calc(100vh - 430px); overflow-y: auto; padding-right: 6px; }
  }
  .mgrid2 { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .mcell { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--bg); }
  .mcell.on { border-color: var(--brass); }
  .mrow { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .mname { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.85rem; }
  .mcell .stepper { gap: 6px; }
  .mcell .step-btn { width: 28px; height: 28px; font-size: 1rem; }
  .mcell .step-count { font-size: 1rem; min-width: 14px; }
  .mcell .field-wrap { margin-top: 6px; min-width: 0; }
  @media (min-width: 861px) { .mgrid2 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .ghead { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: none; border: none; padding: 0; color: var(--ink); font-family: inherit; cursor: pointer; text-align: left; }
  .ghead .gr { display: flex; align-items: center; gap: 8px; }
  .badge { background: var(--brass); color: #fff; border-radius: 999px; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; font-family: 'JetBrains Mono', monospace; }
  .chev { color: var(--ink-soft); font-size: 0.8rem; transition: transform .15s; display: inline-block; }
  .chev.open { transform: rotate(90deg); }
  .mline { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; }
  .mtag { font-size: 0.74rem; color: var(--ink-soft); }
  .s-edit { border: none; background: none; color: var(--steel); font-size: 1rem; padding: 6px 8px; cursor: pointer; border-radius: 8px; }
  .s-edit:active { background: var(--brass-wash); color: var(--brass-strong); }
  .sale-item.editing { background: var(--brass-wash); border-radius: 10px; padding-left: 8px; padding-right: 8px; }
  #saleFormWrap, #expenseFormWrap { scroll-margin-top: 110px; }
  .databar { margin: 10px 20px 0; padding: 10px 14px; border: 1px solid var(--danger); border-radius: 12px; background: var(--bg-elevated); display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; font-size: 0.85rem; }
  .databar.ok { border-color: var(--line); color: var(--ink-soft); padding: 6px 12px; font-size: 0.78rem; }
  .databar button, .est-btn { border: 1px solid var(--brass); background: var(--brass); color: #fff; border-radius: 8px; padding: 6px 12px; font-family: inherit; font-size: 0.82rem; cursor: pointer; }
  .est-btn.alt { background: none; color: var(--brass-strong); }
  .stk-res { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 9px 10px; margin-top: 6px; font-family: inherit; font-size: 0.9rem; cursor: pointer; }
  .qty { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1rem; min-width: 28px; text-align: right; }
  .qty.low { color: var(--danger); }
  .paybox { margin: 10px 0 2px; }
  .pay-opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pay-btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink-soft); border-radius: 9px; padding: 9px 2px; font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
  .pay-btn.on { background: var(--brass); color: #fff; border-color: var(--brass); }
  .showmore { width: 100%; border: 1px dashed var(--line); background: none; color: var(--brass-strong); border-radius: 10px; padding: 8px; font-family: inherit; font-size: 0.82rem; cursor: pointer; margin-top: 8px; }

  /* ===== Embelezamento ===== */
  :root { --shadow: 0 1px 2px rgba(60,40,10,.06), 0 6px 18px rgba(60,40,10,.07); --shadow-lg: 0 10px 30px rgba(60,40,10,.14); --ok: #4F7A3A; --r: 16px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); --ok: #8DBB74; } }
  :root[data-theme="dark"] { --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); --ok: #8DBB74; }
  body { background: radial-gradient(1200px 500px at 85% -10%, var(--brass-wash), transparent 60%), var(--bg); background-attachment: fixed; }
  header { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 1.65rem; }
  h1 .logo { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, var(--brass), var(--brass-strong)); box-shadow: 0 3px 8px rgba(139,94,42,.35), inset 0 1px 0 rgba(255,255,255,.3); }
  h1 .logo svg { width: 20px; height: 20px; }
  .tab-btn { transition: all .15s; padding: 11px 6px; box-shadow: 0 1px 0 rgba(0,0,0,.03); }
  .tab-btn:hover { border-color: var(--brass); color: var(--ink); }
  .tab-btn.active { background: linear-gradient(180deg, var(--brass), var(--brass-strong)); box-shadow: 0 4px 12px rgba(139,94,42,.3); color: #fff; }
  .card, .totals-card, .totalbar, .confirm-bar { border-radius: var(--r); box-shadow: var(--shadow); }
  .card-title { font-family: 'Fraunces', serif; font-size: 1.12rem; padding: 14px 0 6px; letter-spacing: -.01em; }
  .totalbar { background: linear-gradient(135deg, var(--bg-elevated), var(--brass-wash)); border-color: var(--brass); }
  .totalbar .t-count { font-size: 1.5rem; color: var(--brass-strong); }
  .daylabel .date { font-family: 'Fraunces', serif; font-size: 1.15rem; text-transform: none; }
  .daylabel .date::first-letter { text-transform: uppercase; }
  .daylabel .tag { background: var(--brass); color: #fff; padding: 1px 8px; border-radius: 99px; font-size: .66rem; margin-top: 4px; }
  .daylabel .tag:empty { display: none; }
  .daynav button { transition: all .15s; box-shadow: var(--shadow); } .daynav button:hover:not(:disabled) { border-color: var(--brass); color: var(--brass-strong); }
  .step-btn { transition: all .12s; font-weight: 600; } .step-btn:hover { border-color: var(--brass); color: var(--brass-strong); } .step-btn:active { transform: scale(.92); }
  .step-btn.plus { background: var(--brass-wash); }
  .step-count { transition: color .12s; } .stepper:has(.step-count:not(:empty)) .step-count { color: var(--ink-soft); }
  .item-row { transition: background .15s; } .item-row:hover { background: color-mix(in srgb, var(--brass-wash) 35%, transparent); }
  .registrar-btn, .databar button, .est-btn { transition: all .15s; }
  .registrar-btn { background: linear-gradient(180deg, var(--brass), var(--brass-strong)); box-shadow: 0 4px 12px rgba(139,94,42,.28); letter-spacing: .01em; }
  .registrar-btn:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); } .registrar-btn:active:not(:disabled) { transform: translateY(0) scale(.99); }
  .registrar-btn:disabled { background: var(--line); box-shadow: none; }
  .clear-btn { transition: all .15s; } .clear-btn:hover { border-color: var(--brass); color: var(--brass-strong); }
  .pay-btn { transition: all .12s; padding: 10px 2px; } .pay-btn:hover { border-color: var(--brass); } .pay-btn.on { background: linear-gradient(180deg, var(--brass), var(--brass-strong)); box-shadow: 0 2px 8px rgba(139,94,42,.3); }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .field-wrap .money-input, .select-input { transition: border-color .15s, box-shadow .15s; }
  .field-wrap .money-input:focus-within, .select-input:focus { border-color: var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 22%, transparent); }
  .totals-row.discount-row input:focus { border-color: var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 22%, transparent); }
  .totals-row.total-row { font-size: 1.25rem; } .totals-row.total-row .val { color: var(--brass-strong); }
  .section-title { text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; }
  .sale-item { transition: background .15s; border-radius: 10px; padding-left: 8px; padding-right: 8px; } .sale-item:hover { background: color-mix(in srgb, var(--brass-wash) 40%, transparent); }
  .sale-item .s-total { color: var(--brass-strong); }
  .s-discount { display: inline-block; }
  .mcell { transition: all .15s; box-shadow: 0 1px 0 rgba(0,0,0,.03); } .mcell.on { background: var(--brass-wash); box-shadow: 0 0 0 1px var(--brass); }
  .badge { box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .databar { border-radius: var(--r); box-shadow: var(--shadow); } .databar.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .stk-res { transition: all .12s; } .stk-res:hover { border-color: var(--brass); background: var(--brass-wash); }
  .mpop { box-shadow: var(--shadow-lg); }
  .empty { border: 1px dashed var(--line); border-radius: 12px; margin: 8px 0; }
  .item-row > .field-wrap { margin-top: 0 !important; min-width: 0; }
  @media (max-width: 640px) { .item-row > .field-wrap[style] { flex-basis: 100%; } header { padding-left: 14px; padding-right: 14px; } .card, .totals-card, .totalbar, .daynav, .history, .databar { margin-left: 12px; margin-right: 12px; } .history { padding-left: 0; padding-right: 0; } }
  @media print { header, .daynav, .tabbar, .databar { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ===== Resumo dos itens na caixa de totais ===== */
  .sel-sum { padding: 2px 0 10px; margin-bottom: 8px; border-bottom: 1px dashed var(--line); }
  .sel-title { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); padding-bottom: 6px; }
  .sel-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 0; font-size: .92rem; }
  .sel-line .sel-q { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--brass-strong); margin-right: 6px; }
  .sel-line .sel-v { font-family: 'JetBrains Mono', monospace; font-size: .88rem; white-space: nowrap; }
  .sel-line .sel-v.pend { color: var(--danger); }
  .sel-empty { font-size: .85rem; color: var(--ink-soft); padding: 2px 0 4px; }
  @keyframes selIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  .totals-card { position: sticky; top: calc(96px + env(safe-area-inset-top, 0px)); }
  .stk-res:active { transform: scale(.99); }
  .item-row:last-of-type { border-radius: 0 0 12px 12px; }
  @media (max-width: 860px) { .totals-card { position: static; } }

  /* ===== Polimento v3 ===== */
  .sel-line { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 4px 10px; }
  .sel-line .sel-name { font-weight: 500; font-size: .9rem; line-height: 1.25; overflow-wrap: anywhere; }
  .sel-step { display: inline-flex; align-items: center; gap: 2px; background: var(--brass-wash); border-radius: 999px; padding: 2px; }
  .sel-step .sel-q { margin: 0; min-width: 22px; text-align: center; font-size: .95rem; color: var(--ink); }
  .sl-btn { width: 26px; height: 26px; border-radius: 50%; border: none; background: var(--bg-elevated); color: var(--brass-strong); font-size: 1.05rem; line-height: 1; cursor: pointer; font-weight: 700; box-shadow: 0 1px 2px rgba(60,40,10,.15); transition: transform .1s, background .12s; }
  .sl-btn:hover { background: var(--brass); color: #fff; } .sl-btn:active { transform: scale(.88); }
  .sel-line .sel-v { min-width: 74px; text-align: right; font-weight: 700; color: var(--brass-strong); }
  .sel-line .sel-v.pend { color: var(--danger); font-weight: 500; font-size: .78rem; }
  .sel-empty { text-align: center; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }
  .totals-card { border-top: 3px solid var(--brass); }
  .card { border-top: 3px solid var(--brass-wash); }
  .item-label { letter-spacing: -.005em; }
  .stk-res { border-left: 3px solid var(--brass); }
  .sale-item { border-bottom-style: dashed; }
  .totalbar .t-label { text-transform: uppercase; letter-spacing: .07em; font-size: .72rem; font-weight: 600; }
  .registrar-btn:not(:disabled) { position: relative; overflow: hidden; }
  .registrar-btn:not(:disabled)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.22) 50%, transparent 70%); transform: translateX(-120%); transition: transform .6s; }
  .registrar-btn:not(:disabled):hover::after { transform: translateX(120%); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid var(--bg); }
  @media (max-width: 480px) { .sel-line { grid-template-columns: 1fr auto; } .sel-line .sel-v { grid-column: 2; grid-row: 1; } .sel-line .sel-step { grid-column: 1 / -1; justify-self: start; } }

  /* =====================================================================
     TEMA FINAL (v4) — "Oficina de latão"
     Ordem: tokens > fundo > cabeçalho > abas > cartões > itens > totais
            > botões > histórico > estoque > detalhes
     ===================================================================== */
  :root {
    --paper: #FBF7EE; --brass-hi: #C9974F; --brass-lo: #7A5224; --glow: rgba(169,124,59,.28);
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #2B261D; --brass-hi: #E2B877; --brass-lo: #B88442; --glow: rgba(226,184,119,.22); } }
  :root[data-theme="dark"] { --paper: #2B261D; --brass-hi: #E2B877; --brass-lo: #B88442; --glow: rgba(226,184,119,.22); }

  /* --- fundo com textura sutil de oficina --- */
  body {
    background:
      radial-gradient(900px 420px at 100% -8%, var(--brass-wash), transparent 62%),
      radial-gradient(700px 380px at -10% 105%, color-mix(in srgb, var(--brass-wash) 70%, transparent), transparent 60%),
      repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--line) 22%, transparent) 14px 15px),
      var(--bg);
    background-attachment: fixed;
  }

  /* --- cabeçalho --- */
  header { border-bottom: none; box-shadow: 0 1px 0 var(--line), 0 10px 24px -18px rgba(60,40,10,.35); }
  header::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, transparent, var(--brass), transparent); opacity: .7; }
  h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.02em; }
  h1 .logo { width: 42px; height: 42px; border-radius: 13px; transform: rotate(-6deg); transition: transform .3s var(--ease); }
  h1:hover .logo { transform: rotate(8deg) scale(1.06); }
  h1 .logo svg { width: 23px; height: 23px; }
  .sub { font-size: .84rem; letter-spacing: .01em; }

  /* --- abas (controle segmentado) --- */
  .tabbar { gap: 4px; padding: 4px; background: color-mix(in srgb, var(--line) 55%, var(--bg)); border-radius: 16px; box-shadow: inset 0 1px 3px rgba(60,40,10,.12); }
  .tab-btn { border: none; background: transparent; box-shadow: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; font-size: .84rem; transition: all .2s var(--ease); }
  .tab-btn .ti { width: 16px; height: 16px; flex: none; }
  .tab-btn:hover:not(.active) { background: color-mix(in srgb, var(--bg-elevated) 70%, transparent); color: var(--ink); }
  .tab-btn.active { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); box-shadow: 0 4px 12px var(--glow), inset 0 1px 0 rgba(255,255,255,.3); }
  @media (max-width: 420px) { .tab-btn .ti { display: none; } }

  /* --- navegação de dia --- */
  .daylabel .date { font-size: 1.25rem; font-weight: 600; }
  .daylabel .tag { box-shadow: 0 2px 6px var(--glow); letter-spacing: .1em; }
  .daynav button { border-radius: 50%; width: 40px; height: 40px; background: var(--paper); }

  /* --- cartões --- */
  .card, .totals-card { background: linear-gradient(180deg, var(--paper), var(--bg-elevated)); border-radius: var(--r-lg); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.55); }
  :root[data-theme="dark"] .card, :root[data-theme="dark"] .totals-card { box-shadow: var(--shadow); }
  .card-title { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; padding: 16px 0 10px; }
  .card-title::before { content: ''; width: 4px; height: 1.1em; border-radius: 4px; background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); }
  .section-title { display: flex; align-items: center; gap: 10px; color: var(--brass-strong); }
  .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  /* --- itens da venda --- */
  .item-row { border-bottom-color: color-mix(in srgb, var(--line) 80%, transparent); padding: 13px 4px; border-radius: var(--r-sm); }
  .item-label { font-size: .98rem; }
  .item-price { font-size: .76rem; }
  .step-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 2px rgba(60,40,10,.12); }
  .step-btn.plus { background: linear-gradient(180deg, var(--brass-wash), color-mix(in srgb, var(--brass-wash) 70%, var(--brass))); color: var(--brass-lo); border-color: color-mix(in srgb, var(--brass) 45%, var(--line)); }
  .step-btn.plus:hover { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); color: #fff; border-color: transparent; }
  .step-count { font-size: 1.15rem; }
  .stepper:has(.step-count:not(:empty)) .step-count { color: var(--ink); }
  .mcell { border-radius: var(--r-md); background: var(--paper); }
  .mcell.on { background: linear-gradient(180deg, var(--brass-wash), var(--paper)); }
  .mname { color: var(--brass-strong); }
  .ghead:hover .item-label { color: var(--brass-strong); }
  .chev { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--brass-wash); color: var(--brass-strong); font-size: .6rem; }
  .badge { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); }
  .field-wrap .money-input, .select-input { background: var(--paper); border-radius: var(--r-sm); }
  .field-wrap label { font-weight: 500; letter-spacing: .02em; }

  /* --- caixa de totais: estilo "nota/recibo" --- */
  .totals-card { border-top: 4px solid var(--brass); padding: 16px 18px 18px; }
  .sel-title { color: var(--brass-strong); display: flex; align-items: center; gap: 8px; }
  .sel-title::after { content: ''; flex: 1; border-top: 1px dashed var(--line); }
  .sel-line { background: var(--paper); box-shadow: 0 1px 2px rgba(60,40,10,.06); }
  .totals-row { font-size: .95rem; }
  .totals-row.discount-row input { background: var(--paper); border-radius: var(--r-sm); }
  .totals-row.total-row { border-top: 2px dotted var(--brass); margin-top: 8px; padding-top: 14px; align-items: baseline; }
  .totals-row.total-row .val { font-size: 1.7rem; letter-spacing: -.02em; text-shadow: 0 1px 0 rgba(255,255,255,.4); }
  .totalbar { border-radius: var(--r-lg); padding: 14px 18px; position: relative; overflow: hidden; }
  .totalbar::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); }
  .totalbar .t-count { font-size: 1.65rem; letter-spacing: -.02em; }

  /* --- botões --- */
  .registrar-btn { border-radius: var(--r-md); padding: 15px; font-size: 1.02rem; letter-spacing: .02em; background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); box-shadow: 0 6px 16px var(--glow), inset 0 1px 0 rgba(255,255,255,.3); text-shadow: 0 1px 1px rgba(0,0,0,.18); }
  .registrar-btn:disabled { background: color-mix(in srgb, var(--line) 80%, var(--bg)); text-shadow: none; }
  .pay-btn { border-radius: var(--r-sm); background: var(--paper); }
  .pay-btn.on { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); }
  .clear-btn, .est-btn, .showmore { border-radius: var(--r-sm); }
  .est-btn { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); border-color: transparent; }
  .est-btn.alt { background: transparent; border: 1px solid var(--brass); }

  /* --- histórico / listas --- */
  .sale-item { border-radius: var(--r-md); border-bottom: 1px dashed var(--line); padding-top: 13px; padding-bottom: 13px; }
  .sale-item .s-time { background: var(--brass-wash); color: var(--brass-lo); padding: 1px 7px; border-radius: 99px; width: fit-content; font-size: .7rem; }
  .sale-item .s-total { font-size: 1.05rem; }
  .s-discount { background: color-mix(in srgb, var(--brass-wash) 70%, transparent); padding: 1px 8px; border-radius: 99px; font-size: .7rem; width: fit-content; }
  .s-edit, .s-del { width: 32px; height: 32px; display: inline-grid; place-items: center; padding: 0; }
  .s-edit:hover { background: var(--brass-wash); color: var(--brass-strong); } .s-del:hover { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .empty { background: color-mix(in srgb, var(--brass-wash) 25%, transparent); font-size: .88rem; }
  .stk-res { border-radius: var(--r-sm); background: var(--paper); }

  /* --- barra de dados, popover, foco --- */
  .databar { background: linear-gradient(135deg, var(--paper), var(--bg-elevated)); }
  .mpop { border-radius: var(--r-lg); background: var(--paper); }
  .mpop button.sel { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); }
  ::selection { background: var(--brass); color: #fff; }
  .item-info { flex: 1 1 0; min-width: 0; } .item-label { overflow-wrap: anywhere; }
  .step-btn.plus { color: var(--brass-strong); }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  /* =====================================================================
     VISUAL v5 — "Oficina de latão" (nav flutuante, hero, blocos, recibo)
     ===================================================================== */
  :root { --bg:#F3ECDD; --bg-elevated:#FFFBF2; --paper:#FFFBF2; --ink:#2A2118; --ink-soft:#85775F; --brass:#B8863B; --brass-strong:#6E4817; --brass-wash:#F1E3C4; --line:#E5D8BD; --brass-hi:#E3B965; --brass-lo:#B8863B; --glow:rgba(184,134,59,.35); --on-gold:#2A2118; --hero:linear-gradient(135deg,#2A2118,#4A3418 60%,#7A5624); --heroInk:#FFF4DA; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14110D; --bg-elevated:#1F1A13; --paper:#1F1A13; --ink:#F3E9D2; --ink-soft:#A89B82; --brass:#E3B965; --brass-strong:#F6D88F; --brass-wash:#3A2D18; --line:#33291B; --brass-hi:#F6D88F; --brass-lo:#E3B965; --glow:rgba(227,185,101,.3); --hero:linear-gradient(135deg,#2B2113,#47321A 60%,#8A6528); } }
  :root[data-theme="dark"] { --bg:#14110D; --bg-elevated:#1F1A13; --paper:#1F1A13; --ink:#F3E9D2; --ink-soft:#A89B82; --brass:#E3B965; --brass-strong:#F6D88F; --brass-wash:#3A2D18; --line:#33291B; --brass-hi:#F6D88F; --brass-lo:#E3B965; --glow:rgba(227,185,101,.3); --hero:linear-gradient(135deg,#2B2113,#47321A 60%,#8A6528); }
  .tab-btn.active, .registrar-btn, .pay-btn.on, .est-btn, .badge, .mpop button.sel, .daylabel .tag, .databar button, h1 .logo, .step-btn.plus:hover, .sl-btn:hover, .registrar-btn:disabled { color: var(--on-gold); }
  .registrar-btn:disabled { color: var(--ink-soft); }
  .est-btn.alt { color: var(--brass-strong); }
  .badge[style] { color: #fff; }
  #app { padding-bottom: 110px; }
  header { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }

  /* nav flutuante */
  header .tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: auto; max-width: none; z-index: 30; padding: 6px; gap: 4px; border-radius: 22px; background: color-mix(in srgb, var(--bg-elevated) 84%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: 0 18px 40px -10px rgba(0,0,0,.45); }
  .tab-btn { flex: none; flex-direction: column; gap: 2px; padding: 8px 16px; font-size: .68rem; border-radius: 16px; }
  .tab-btn .ti { display: block !important; width: 20px; height: 20px; }

  /* hero */
  .hero { position: relative; overflow: hidden; margin: 16px 20px 0; border-radius: 28px; background: var(--hero); color: var(--heroInk); padding: 22px 24px 0; box-shadow: var(--shadow); }
  .hero::before { content: ''; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, #ffd98a55, transparent 70%); pointer-events: none; }
  .hero small { letter-spacing: .14em; text-transform: uppercase; font-size: .7rem; opacity: .78; }
  .hero .big { font-family: 'Fraunces', serif; font-weight: 800; font-size: clamp(2.6rem, 9vw, 4rem); line-height: 1.05; letter-spacing: -.04em; margin: 6px 0 2px; }
  .pays { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; min-height: 8px; }
  .pays div { background: rgba(0,0,0,.28); border-radius: 12px; padding: 8px 12px; font-size: .78rem; }
  .pays b { display: block; font-family: 'JetBrains Mono', monospace; font-size: .95rem; }
  .spark { display: block; width: calc(100% + 48px); margin: 10px -24px 0; height: 84px; }
  .spark-cap { position: absolute; right: 18px; bottom: 8px; font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }

  /* blocos de produto */
  #saleFormWrap .card { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 6px 16px 18px; }
  #saleFormWrap .card > * { grid-column: 1 / -1; }
  #saleFormWrap .card > .tile-row { grid-column: auto; }
  .card > .tile-row { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0; background: var(--bg-elevated); border: 1px solid var(--line); border-radius: 22px; padding: 16px 14px 14px; box-shadow: var(--shadow); transition: transform .2s, border-color .2s, box-shadow .2s; }
  .card > .tile-row:hover { transform: translateY(-3px); border-color: var(--brass); background: var(--bg-elevated); }
  .card > .tile-row.on { border-color: var(--brass); box-shadow: 0 0 0 2px var(--brass), 0 14px 30px -8px var(--glow); }
  .tile-row .ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--brass) 16%, transparent); color: var(--brass-strong); margin-bottom: 12px; }
  .tile-row.on .ico { background: linear-gradient(145deg, var(--brass-hi), var(--brass-lo)); color: var(--on-gold); }
  .tile-row .item-info { flex: none; }
  .tile-row .stepper { justify-content: space-between; margin-top: 12px; background: color-mix(in srgb, var(--brass) 12%, transparent); border-radius: 99px; padding: 3px; }
  .tile-row .step-btn { width: 34px; height: 34px; }
  .tile-row .extra-fields { margin-top: 10px; }

  /* recibo */
  .totals-card { border-radius: 24px 24px 0 0; margin-bottom: 28px; background: var(--bg-elevated); border-top: 5px solid var(--brass); }
  .totals-card::after { content: ''; position: absolute; left: 0; right: 0; bottom: -12px; height: 12px; background: linear-gradient(-45deg, transparent 8px, var(--bg-elevated) 0), linear-gradient(45deg, transparent 8px, var(--bg-elevated) 0); background-size: 16px 16px; background-position: left bottom; }
  .totals-card { position: sticky; }
  @media (max-width: 860px) { .totals-card { position: relative; } }
  .registrar-btn, .pay-btn.on, .tab-btn.active { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); }
  .totalbar { background: var(--bg-elevated); }

  /* aviso */
  .toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -110px); background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 99px; font-weight: 600; box-shadow: 0 12px 30px rgba(0,0,0,.35); transition: transform .35s cubic-bezier(.2,.9,.3,1.3); z-index: 50; pointer-events: none; }
  .toast.show { transform: translate(-50%, 0); }
  .step-btn.plus:hover { color: var(--on-gold) !important; }
  .databar { margin-top: 14px; }
  @media (max-width: 640px) { .hero { margin-left: 12px; margin-right: 12px; } }

  /* =====================================================================
     v6 — produtos em lista compacta + painel de busca do estoque
     ===================================================================== */
  #saleFormWrap .card { display: block; padding: 6px 16px 14px; }
  .card > .tile-row { flex-direction: row; flex-wrap: wrap; align-items: center; background: transparent; border: none; border-bottom: 1px dashed var(--line); border-radius: 12px; box-shadow: none; padding: 9px 6px; transition: background .15s; }
  .card > .tile-row:hover { transform: none; background: color-mix(in srgb, var(--brass-wash) 45%, transparent); }
  .card > .tile-row.on { box-shadow: none; border-color: var(--line); background: color-mix(in srgb, var(--brass-wash) 70%, transparent); }
  .tile-row .ico, .stk-sel .ico { width: 34px; height: 34px; border-radius: 11px; margin: 0 12px 0 0; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--brass) 16%, transparent); color: var(--brass-strong); }
  .tile-row .ico svg, .stk-sel .ico svg { width: 18px; height: 18px; }
  .tile-row .item-info, .stk-sel .item-info { flex: 1 1 0; min-width: 0; }
  .tile-row .stepper { margin: 0; padding: 2px; background: color-mix(in srgb, var(--brass) 12%, transparent); }
  .tile-row .step-btn { width: 30px; height: 30px; }
  .tile-row .extra-fields { margin-top: 8px; padding-left: 46px; }
  .stk-sel { background: color-mix(in srgb, var(--brass-wash) 70%, transparent); border-radius: 12px; border: 1px solid var(--brass) !important; margin: 6px 0; padding: 9px 8px !important; flex-wrap: nowrap; align-items: center; }

  .stk-panel { padding: 8px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .stk-tip { font-size: .8rem; color: var(--ink-soft); margin: 0 0 10px; } .stk-tip b { color: var(--brass-strong); }
  .stk-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 1040px) { .stk-grid { grid-template-columns: minmax(0, 1fr); } }
  .stk-box { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 10px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
  .stk-box:focus-within { border-color: var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 22%, transparent); }

<script>
(function () {
  /* ÍNDICE DO CÓDIGO
     1. Configuração   (categorias, preços, formas de pagamento)
     2. Estado e dados (localStorage: vendas, gastos, estoque)
     3. Aba Vendas     (formulário, resumo de itens, totais, histórico)
     4. Aba Gastos     (formulário e histórico)
     5. Aba Estoque    (produtos, entradas, busca na venda)
     6. Aba Resumo     (mês, fiado, relatório CSV, backup)
     7. Arquivo de dados no disco e navegação (dia/mês) */
  var CATEGORIES = [
    { id: 'simples', label: 'Chave Simples', price: 14 },
    { id: 'tetra', label: 'Tetra', price: 35 },
    { id: 'moto', label: 'Moto', price: 50 },
    { id: 'carro', label: 'Carro', price: null },
    { id: 'outros', label: 'Outros', price: null }
  ];
  var PRECO_AVULSO = 20, PRECO_TROCA = 30;
  var GROUPS = [
    { id: 'bateria', label: 'Bateria', models: ['CR2032', 'CR2016', 'CR1620', 'CR2025', 'CR1616', 'CR2450'] },
    { id: 'pilha', label: 'Pilha', models: ['A23', 'A27'] }
  ];
  (function () {
    var extra = [];
    GROUPS.forEach(function (g) {
      g.models.forEach(function (m) {
        extra.push({ id: g.id + '-' + m, label: g.label + ' ' + m, price: PRECO_AVULSO, group: g.id, model: m, kind: 'avulso' });
        extra.push({ id: g.id + '-' + m + '-troca', label: g.label + ' ' + m + ' (troca no controle)', price: PRECO_TROCA, group: g.id, model: m, kind: 'troca' });
      });
    });
    var at = CATEGORIES.findIndex(function (c) { return c.id === 'carro'; }) + 1;
    CATEGORIES.splice.apply(CATEGORIES, [at, 0].concat(extra));
  })();
  var SERVICES = [['srv-porta', 'Abertura de porta'], ['srv-carro', 'Abertura de carro'], ['srv-copia', 'Cópia de chave codificada'], ['srv-controle', 'Programação de controle'], ['srv-fechadura', 'Instalação / troca de fechadura'], ['srv-outro', 'Outro serviço']].map(function (a) { return { id: a[0], label: a[1], price: null, svc: true }; });
  SERVICES.forEach(function (s) { CATEGORIES.push(s); });
  var PAY = { dinheiro: 'Dinheiro', pix: 'Pix', cartao: 'Cartão', fiado: 'Fiado' };
  var EXPENSE_CATEGORIES = [
    { id: 'mercadoria', label: 'Chaves e mercadoria' },
    { id: 'aluguel', label: 'Aluguel' },
    { id: 'contas', label: 'Contas (água, luz, internet)' },
    { id: 'outros', label: 'Outros gastos' }
  ];
  var STORAGE_VENDAS = 'chaveiro_vendas_v2';
  var STORAGE_DESPESAS = 'chaveiro_despesas_v1';

  var currentTab = 'vendas';
  var currentOffset = 0;
  var currentMonthOffset = 0;

  // legacyItems: itens de uma venda em edição que não cabem no formulário (categoria antiga/desconhecida,
  // linhas repetidas). São mostrados só para leitura e regravados intactos ao salvar.
  var itemState = {}, stockItems = {}, stockQueries = {}, payState = 'cartao', clienteState = '', outrosList = [], outrosFocus = false, legacyItems = [];
  function resetItemState() {
    stockItems = {}; stockQueries = {}; payState = 'cartao'; clienteState = ''; outrosList = []; legacyItems = [];
    CATEGORIES.forEach(function (c) { itemState[c.id] = { qty: 0, price: c.price !== null ? c.price : '', desc: '', over: null }; });
  }
  resetItemState();
  var finalValueRaw = '';
  var editingSaleId = null, editingExpId = null;
  var groupOpen = (function () { try { return JSON.parse(localStorage.getItem('chaveiro_ui_v1')) || {}; } catch (e) { return {}; } })();
  if (groupOpen.svc === undefined) groupOpen.svc = false;
  function saveUi() { try { localStorage.setItem('chaveiro_ui_v1', JSON.stringify(groupOpen)); } catch (e) {} }
  function cancelEdit() { if (editingSaleId) { resetItemState(); finalValueRaw = ''; } editingSaleId = null; editingExpId = null; }

  /* ----- Cache em memória (Fase 2) -----
     As listas são lidas (JSON.parse + validação) UMA vez e ficam em CACHE. loadVendas/loadDespesas/loadEstoque
     devolvem o array do cache: ele é SOMENTE LEITURA. Quem altera dados trabalha numa cópia (array.slice() e
     objetos novos com Object.assign — "copy-on-write") e grava com commit(); só depois que o localStorage
     aceitou a gravação o cache passa a apontar para os novos arrays. Se a gravação falhar, o cache continua
     igual ao que está salvo (mesma garantia da Fase 1). Alterações feitas em outra aba chegam pelo evento
     "storage" e invalidam o cache. Índices derivados (Map de produtos, vendas por dia/mês, mais vendidos...)
     são recalculados só quando o array de origem muda (comparação por referência). */
  var CACHE = {}, RAW = {}; // RAW: texto do localStorage correspondente a cada lista do cache
  function listDef(key) { return key === STORAGE_VENDAS ? [normSale, 'venda'] : key === STORAGE_DESPESAS ? [normExp, 'gasto'] : [normEst, 'produto']; }
  function cachedList(key) {
    if (!Object.prototype.hasOwnProperty.call(CACHE, key)) { var d = listDef(key); setCache(key, readList(key, d[0], d[1])); }
    return CACHE[key];
  }
  // Modo de verificação (só para testes): com window.__chaveiroFreeze = true o cache é congelado, e qualquer
  // código que tente alterá-lo diretamente falha — garante que tudo passa por cópia + commit().
  function deepFreeze(o) { if (o && typeof o === 'object' && !Object.isFrozen(o)) { Object.freeze(o); Object.keys(o).forEach(function (k) { deepFreeze(o[k]); }); } return o; }
  function setCache(key, list) { CACHE[key] = window.__chaveiroFreeze ? deepFreeze(list) : list; }
  function isListKey(k) { return k === STORAGE_VENDAS || k === STORAGE_DESPESAS || k === STORAGE_ESTOQUE; }
  function invalidateCache(key) { if (key == null) { CACHE = {}; RAW = {}; } else { delete CACHE[key]; delete RAW[key]; } }
  function loadVendas() { return cachedList(STORAGE_VENDAS); }
  function saveVendas(list) { var m = {}; m[STORAGE_VENDAS] = list; return commit(m); }
  function loadDespesas() { return cachedList(STORAGE_DESPESAS); }
  function saveDespesas(list) { var m = {}; m[STORAGE_DESPESAS] = list; return commit(m); }

  // Índice do estoque: Map id -> produto (busca O(1)), lista dos abaixo do mínimo e ordem de exibição.

  /* ----- Atualização parcial do formulário de venda -----
     Cada bloco (linha de categoria, grupo de baterias/pilhas, "Outros", produto do estoque escolhido, cabeçalho
     de serviços) é gerado a partir do estado por uma única função. Ao clicar em +/−, só o bloco afetado é
     trocado e os totais são atualizados. Se o bloco não for encontrado, cai na renderização completa. */
  function replaceBlock(id, html) {
    var wrap = document.getElementById('saleFormWrap'), el = wrap && wrap.querySelector('[data-block="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
    if (!el) return false;
    if (html) el.outerHTML = html; else el.remove();
    return true;
  }
  function refreshCat(catId) {
    var c = CATEGORIES.find(function (x) { return x.id === catId; }); if (!c) return renderSaleForm();
    var ok = c.group ? replaceBlock('g-' + c.group, groupHtml(GROUPS.find(function (g) { return g.id === c.group; }))) : replaceBlock('c-' + c.id, catRowHtml(c));
    if (ok && c.svc) ok = replaceBlock('svchead', svcHeadHtml());
    if (!ok) return renderSaleForm();
    updateTotalsDisplay();
  }
  function refreshStock(pid) { if (!replaceBlock('sp-' + pid, stockSelRowHtml(pid))) return renderSaleForm(); updateTotalsDisplay(); }
  function refreshOutros() {
    if (!replaceBlock('outros', outrosBlockHtml())) return renderSaleForm();
    if (outrosFocus) { outrosFocus = false; var ds = document.querySelectorAll('#saleFormWrap [data-outro-desc]'); if (ds.length) ds[ds.length - 1].focus(); }
    updateTotalsDisplay();
  }
  function changeCat(id, d) { var st = itemState[id]; if (!st) return; st.qty = Math.max(0, st.qty + d); refreshCat(id); }
  function changeStock(pid, d) { var s = stockItems[pid]; if (!s) return; s.qty += d; if (s.qty <= 0) delete stockItems[pid]; refreshStock(pid); }
  // Um único par de listeners (clique/digitação) para o formulário inteiro, ligado uma vez.
  function bindSaleFormEvents() {
    var wrap = document.getElementById('saleFormWrap');
    if (!wrap || wrap.getAttribute('data-bound')) return;
    wrap.setAttribute('data-bound', '1');
    wrap.addEventListener('click', function (ev) {
      var b = ev.target.closest('button'); if (!b || !wrap.contains(b)) return;
      var v;
      if ((v = b.getAttribute('data-cat')) !== null) return changeCat(v, b.classList.contains('plus') ? 1 : -1);
      if (b.classList.contains('stk-minus') || b.classList.contains('stk-plus')) return changeStock(b.getAttribute('data-pid'), b.classList.contains('stk-plus') ? 1 : -1);
      if ((v = b.getAttribute('data-outro-minus')) !== null) { var o = outrosList[+v]; if (o) o.qty = Math.max(1, o.qty - 1); return refreshOutros(); }
      if ((v = b.getAttribute('data-outro-plus')) !== null) { if (outrosList[+v]) outrosList[+v].qty += 1; return refreshOutros(); }
      if ((v = b.getAttribute('data-outro-del')) !== null) { outrosList.splice(+v, 1); return refreshOutros(); }
      if (b.id === 'outroAddBtn') { outrosList.push({ desc: '', price: '', qty: 1 }); outrosFocus = true; return refreshOutros(); }
      if ((v = b.getAttribute('data-group')) !== null) {
        groupOpen[v] = groupOpen[v] === false; saveUi();
        var g = GROUPS.find(function (x) { return x.id === v; });
        if (!(g && replaceBlock('g-' + v, groupHtml(g)))) renderSaleForm(); // serviços: renderização completa
        return;
      }
      if ((v = b.getAttribute('data-fav')) !== null) {
        var id = v.slice(2);
        if (v.charAt(0) === 'p') { var x = estoqueFind(id); if (!x) return; if (stockItems[id]) stockItems[id].qty += 1; else stockItems[id] = { qty: 1, price: String(x.preco || '').replace('.', ','), name: pname(x) }; }
        else if (itemState[id]) itemState[id].qty += 1;
        return renderSaleForm();
      }
    });
    wrap.addEventListener('input', function (ev) {
      var inp = ev.target, v;
      if ((v = inp.getAttribute('data-outro-desc')) !== null) { if (outrosList[+v]) outrosList[+v].desc = inp.value; var e = document.getElementById('selSum'); if (e) e.outerHTML = selSumHtml(); return; }
      if ((v = inp.getAttribute('data-outro-price')) !== null) { if (outrosList[+v]) outrosList[+v].price = inp.value; return updateTotalsDisplay(); }
      if ((v = inp.getAttribute('data-price-cat')) !== null) { if (itemState[v]) itemState[v].price = inp.value; return updateTotalsDisplay(); }
    });
  }

  function renderSaleForm() {

      '<div class="totals-row" id="discountRow" style="display:' + (fi.discount > 0 ? 'flex' : 'none') + '"><span>Desconto aplicado</span><span id="discountDisplay">' + brl(fi.discount) + '</span></div>' +
      '<div class="totals-row total-row"><span>Total</span><span class="val" id="totalDisplay">' + (fi.error ? '—' : brl(fi.total)) + '</span></div>' +
      payHtml() + '<button class="registrar-btn" id="registrarBtn" ' + (valid ? '' : 'disabled') + '>' + (editingSaleId ? 'Salvar alterações' : 'Registrar venda') + '</button><div class="reg-hint' + (fi.error ? ' err' : '') + '" id="regHint">' + escAttr(regHint()) + '</div>' + (editingSaleId ? '<button class="clear-btn" id="cancelEditBtn" style="width:100%;margin-top:8px">Cancelar edição</button>' : '') +
      '</div>';

    bindSaleFormEvents();

    var registrarBtn = document.getElementById('registrarBtn');

    bindStockPicker(wrap); bindPay();

  }

  function registrarVenda() {
    var viewDate = dateForOffset(currentOffset);
    var key = dayKey(viewDate);
    var items = [];
    CATEGORIES.forEach(function (c) {
      var it = itemState[c.id];
      if (it.qty > 0) {
        var unit = unitOf(c);
        var rec = { cat: c.id, qty: it.qty, unitPrice: unit, desc: it.desc || '' };
        if (c.group) { rec.pid = gStockId(c.group, c.model); }
        items.push(rec);
      }
    });
    outrosList.forEach(function (o) { if (num(o.price) > 0 && o.qty > 0) items.push({ cat: 'outros', qty: o.qty, unitPrice: money(num(o.price)), desc: (o.desc || '').trim() }); });
    Object.keys(stockItems).forEach(function (k) { var s = stockItems[k]; items.push({ cat: 'estoque', pid: k, qty: s.qty, unitPrice: money(num(s.price)), desc: s.name }); });
    legacyItems.forEach(function (i) { items.push(i); }); // itens antigos voltam exatamente como estavam
    var fi = finalInfo();
    if (fi.error || !isFormValid()) { updateTotalsDisplay(); return; }
    // Cópias rasas para alterar; os arrays do cache ficam intactos e servem de snapshot para "desfazer".
    var snap = { v: loadVendas(), e: loadEstoque() };
    var all = snap.v.slice(), es = snap.e.slice();
    var fields = { items: items, subtotal: fi.subtotal, discount: fi.discount, total: fi.total, pay: payState, cliente: payState === 'fiado' ? clienteState.trim() : '' };
    var idx = editingSaleId ? all.findIndex(function (e) { return e.id === editingSaleId; }) : -1;
    if (editingSaleId && idx < 0) { showToast('Esta venda não existe mais (foi removida). Cancele a edição.', false, true); return; }
    var rec;
    if (idx >= 0) {
      // Edição: merge sobre o registro original, preservando id/dia/hora e qualquer campo extra (recebidoEm etc.).
      var orig = all[idx];
      applyStock(es, orig, 1);
      rec = Object.assign({}, orig, fields);
      if (payState !== 'fiado' && orig.recebidoEm && orig.cliente) rec.cliente = orig.cliente; // fiado já recebido: mantém o nome
      all[idx] = rec;
    } else {
      rec = Object.assign({ id: genId(), day: key, ts: viewDate.getTime(), manual: currentOffset !== 0 }, fields);
      all.push(rec);
    }
    applyStock(es, rec, -1);
    // Venda e estoque gravados juntos: se falhar, nada muda e o formulário continua preenchido.
    if (!commit(dataMap(all, null, es))) return;
    undoSnap = snap;
    var wasEdit = idx >= 0; editingSaleId = null;
    showToast(wasEdit ? 'Alterações salvas' : 'Venda registrada', true);
    resetItemState();
    finalValueRaw = '';
    renderApp();
  }
  function startEditSale(sale) {
    resetItemState();
    (sale.items || []).forEach(function (i) {
      if (!isObj(i)) return;
      if (i.cat === 'estoque' && i.pid) {
        var ex = stockItems[i.pid];
        if (!ex) { stockItems[i.pid] = { qty: i.qty, price: String(i.unitPrice).replace('.', ','), name: i.desc }; return; }

        var blob = new Blob(['\uFEFF' + buildCSV(mKey, vendas, despesas, totalBruto, totalDesconto, totalLiquido, totalDespesas, saldo)], { type: 'text/csv;charset=utf-8' });

    }).join('');

    var html = '';
    html += chartsHtml(mKey);
    html += '<div class="card"><div class="card-title">Vendas do mês</div>' +
      (vendasRows || '<div class="empty">Nenhuma venda neste mês.</div>') +
      '<div class="totals-row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px;"><span>Total bruto</span><span>' + brl(totalBruto) + '</span></div>' +
      (totalDesconto > 0 ? '<div class="totals-row"><span>Descontos</span><span>' + brl(totalDesconto) + '</span></div>' : '') +
      '<div class="totals-row" style="font-weight:700;"><span>Total líquido</span><span>' + brl(totalLiquido) + '</span></div></div>';
    html += '<div class="card"><div class="card-title">Gastos do mês</div>' +
      (despesasRows || '<div class="empty">Nenhum gasto neste mês.</div>') +
      '<div class="totals-row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;"><span>Total de gastos</span><span>' + brl(totalDespesas) + '</span></div></div>';
    html += resumoExtras(vendas, porCategoria);
    html += '<div class="totals-card"><div class="totals-row total-row"><span>Saldo do mês</span><span class="val">' + brl(saldo) + '</span></div></div>';
    html += '<div class="footer-actions"><button class="registrar-btn" id="exportBtn" style="width:auto;padding:12px 22px;">Baixar relatório do mês (Excel/CSV)</button></div>' +
      '<div class="export-msg" id="exportMsg"></div>';
    html += backupCardHtml();

    document.getElementById('resumoContent').innerHTML = html;
    var exportBtn = document.getElementById('exportBtn');
    if (exportBtn) exportBtn.addEventListener('click', function () { exportarMes(mKey, vendas, despesas, totalBruto, totalDesconto, totalLiquido, totalDespesas, saldo); });
    bindBackup(); bindReceber(); bindShowMore();
  }

  function renderApp() {
    ensureGroupStock();
    var estBadge = document.getElementById('estBadge');
    if (estBadge) { var lowN = estIndex().low.length; estBadge.textContent = lowN; estBadge.style.display = lowN > 0 ? 'inline-block' : 'none'; }
    document.querySelectorAll('.tab-btn').forEach(function (btn) { btn.classList.toggle('active', btn.getAttribute('data-tab') === currentTab); });
    document.getElementById('dayNav').style.display = (currentTab === 'resumo' || currentTab === 'estoque') ? 'none' : 'flex';
    document.getElementById('monthNav').style.display = (currentTab === 'resumo') ? 'flex' : 'none';
    document.getElementById('vendasSection').style.display = currentTab === 'vendas' ? 'block' : 'none';
    document.getElementById('despesasSection').style.display = currentTab === 'despesas' ? 'block' : 'none';
    document.getElementById('resumoSection').style.display = currentTab === 'resumo' ? 'block' : 'none';
    document.getElementById('estoqueSection').style.display = currentTab === 'estoque' ? 'block' : 'none';
    if (currentTab === 'vendas') { renderSaleForm(); renderHistoryAndTotal(); setupClearVendas(); }
    else if (currentTab === 'despesas') { renderExpenseForm(); renderExpenseHistoryAndTotal(); setupClearExp(); }
    else if (currentTab === 'resumo') { renderResumo(); }
    else if (currentTab === 'estoque') { renderEstoque(); }
    renderDataBar();
  }

  document.querySelectorAll('.tab-btn').forEach(function (btn) { btn.addEventListener('click', function () { cancelEdit(); currentTab = btn.getAttribute('data-tab'); renderApp(); }); });
  var histSearchEl = document.getElementById('histSearch');
  var histTimer = null; // debounce: a busca percorre todo o histórico
  if (histSearchEl) histSearchEl.addEventListener('input', function () { clearTimeout(histTimer); histTimer = setTimeout(renderHistoryAndTotal, 150); });
  // Outra aba alterou os dados: descarta o cache daquela lista e redesenha.
  window.addEventListener('storage', function (ev) {
    if (ev.key === null || isListKey(ev.key)) { invalidateCache(ev.key); renderApp(); }
    else if (ev.key === STORAGE_META) renderApp();
  });
  document.getElementById('prevDay').addEventListener('click', function () { cancelEdit(); currentOffset -= 1; renderApp(); });
  document.getElementById('nextDay').addEventListener('click', function () { if (currentOffset < 0) { cancelEdit(); currentOffset += 1; renderApp(); } });
  document.getElementById('prevMonth').addEventListener('click', function () { currentMonthOffset -= 1; renderApp(); });
  document.getElementById('nextMonth').addEventListener('click', function () { if (currentMonthOffset < 0) { currentMonthOffset += 1; renderApp(); } });

  function setupClear(footerId, btnId, btnLabel, msg, chkId, yesId, doClear) {
    var footer = document.getElementById(footerId);
    var again = function () { setupClear(footerId, btnId, btnLabel, msg, chkId, yesId, doClear); };
    footer.innerHTML = '<button class="clear-btn" id="' + btnId + '">' + btnLabel + '</button>';
    document.getElementById(btnId).addEventListener('click', function () {
      footer.innerHTML = '<div class="confirm-bar" style="flex-direction:column;align-items:stretch;">' +
        '<span>' + msg + '</span>' +
        '<label><input type="checkbox" id="' + chkId + '"> Sim, tenho certeza que quero apagar</label>' +
        '<span class="cbtns" style="justify-content:flex-end;"><button class="no">Cancelar</button><button class="yes" id="' + yesId + '" disabled>Apagar tudo</button></span></div>';
      document.getElementById(chkId).addEventListener('change', function (ev) { document.getElementById(yesId).disabled = !ev.target.checked; });
      footer.querySelector('.no').addEventListener('click', again);
      document.getElementById(yesId).addEventListener('click', function () { doClear(dayKey(dateForOffset(currentOffset))); renderApp(); });
    });
  }
  function setupClearVendas() {
    setupClear('footerActions', 'clearBtn', 'Limpar vendas do dia', 'Isso vai apagar TODAS as vendas registradas neste dia. Não dá pra desfazer.', 'confirmClearVendas', 'confirmClearVendasBtn',
      function (key) {
        var snap = { v: loadVendas(), e: loadEstoque() }, all = snap.v, es = snap.e.slice();
        all.filter(function (e) { return e.day === key; }).forEach(function (s) { applyStock(es, s, 1); });
        if (!commit(dataMap(all.filter(function (e) { return e.day !== key; }), null, es))) return;
        undoSnap = snap; showToast('Vendas do dia apagadas', true);
      });
  }
  function setupClearExp() {
    setupClear('expFooterActions', 'clearExpBtn', 'Limpar gastos do dia', 'Isso vai apagar TODOS os gastos registrados neste dia. Não dá pra desfazer.', 'confirmClearDespesas', 'confirmClearDespesasBtn',
      function (key) { if (saveDespesas(loadDespesas().filter(function (e) { return e.day !== key; }))) showToast('Gastos do dia apagados'); });
  }

  // Escolher um dia específico
  var datePick = document.getElementById('datePick');
  document.getElementById('dateBtn').addEventListener('click', function () {
    datePick.max = dayKey(new Date());
    datePick.value = dayKey(dateForOffset(currentOffset));
    try { datePick.showPicker(); } catch (e) { datePick.focus(); }
  });
  datePick.addEventListener('change', function () {
    if (!datePick.value) return;
    var p = datePick.value.split('-'), t = new Date(); t.setHours(0, 0, 0, 0);
    cancelEdit(); currentOffset = Math.min(0, Math.round((new Date(+p[0], +p[1] - 1, +p[2]) - t) / 86400000));
    renderApp();
  });

  // Escolher um mês específico
  var MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  var pickYear = 0;
  var monthPop = document.getElementById('monthPop');
  function renderMonthPop() {
    var now = new Date(), cur = monthForOffset(currentMonthOffset);
    var h = '<div class="myear"><button data-y="-1">‹</button><b>' + pickYear + '</b><button data-y="1"' + (pickYear >= now.getFullYear() ? ' disabled' : '') + '>›</button></div><div class="mgrid">';
    MESES.forEach(function (m, i) {
      var future = pickYear > now.getFullYear() || (pickYear === now.getFullYear() && i > now.getMonth());
      var sel = pickYear === cur.getFullYear() && i === cur.getMonth();
      h += '<button data-m="' + i + '"' + (future ? ' disabled' : '') + (sel ? ' class="sel"' : '') + '>' + m + '</button>';
    });
    monthPop.innerHTML = h + '</div>';
  }
  document.getElementById('monthBtn').addEventListener('click', function () {
    if (monthPop.hidden) { pickYear = monthForOffset(currentMonthOffset).getFullYear(); renderMonthPop(); monthPop.hidden = false; }
    else { monthPop.hidden = true; }
  });
  monthPop.addEventListener('click', function (ev) {
    ev.stopPropagation();
    var b = ev.target.closest('button');
    if (!b || b.disabled) return;
    if (b.getAttribute('data-y')) { pickYear += parseInt(b.getAttribute('data-y'), 10); renderMonthPop(); }
    else if (b.getAttribute('data-m')) {
      var now = new Date();
      currentMonthOffset = (pickYear - now.getFullYear()) * 12 + (parseInt(b.getAttribute('data-m'), 10) - now.getMonth());
      monthPop.hidden = true;
      renderApp();
    }
  });
  document.addEventListener('click', function (ev) { if (!ev.target.closest('#monthBtn')) monthPop.hidden = true; });

  (function () {
    document.getElementById('saleTotalsWrap').addEventListener('click', function (ev) {
      var b = ev.target.closest('.sl-btn'); if (!b) return;
      var d = b.classList.contains('sl-plus') ? 1 : -1, sp = b.getAttribute('data-sp'), sc = b.getAttribute('data-sc'), so = b.getAttribute('data-so');
      // Mesmo caminho dos botões do formulário: atualiza só o bloco afetado + totais.
      if (so !== null && outrosList[+so]) { outrosList[+so].qty += d; if (outrosList[+so].qty <= 0) outrosList.splice(+so, 1); refreshOutros(); }
      else if (sp && stockItems[sp]) changeStock(sp, d);
      else if (sc && itemState[sc]) changeCat(sc, d);
    });
  })();
  document.addEventListener('click', function (ev) {
    if (!ev.target.closest('[data-goal]')) return;
    var cur = loadMeta(), v = prompt('Meta de faturamento do mês (R$):', cur ? String(cur).replace('.', ',') : '');
    if (v === null) return;
    var n = parseMoney(v.trim() === '' ? '0' : v);
    if (isNaN(n) || n < 0) { showToast('Meta inválida. Digite só o número, ex: 20000 ou 20.000.', false, true); return; }
    if (saveMeta(n)) renderApp();
  });
  function syncStickyOffsets() {
    var h = document.querySelector('header'), root = document.documentElement.style;
    var hh = h ? h.offsetHeight : 0; root.setProperty('--hdr-h', hh + 'px');
    var nav = document.getElementById(currentTab === 'resumo' ? 'monthNav' : 'dayNav');
    var nh = nav && nav.offsetParent !== null ? nav.offsetHeight : 0;
    root.setProperty('--stick-top', (hh + nh) + 'px');
  }
  window.addEventListener('resize', syncStickyOffsets);
  window.addEventListener('load', syncStickyOffsets);
  if (window.ResizeObserver) { var ro = new ResizeObserver(syncStickyOffsets); ['header', '#dayNav', '#monthNav'].forEach(function (q) { var e = document.querySelector(q); if (e) ro.observe(e); }); }
  document.querySelectorAll('.tab-btn').forEach(function (b) { b.addEventListener('click', function () { setTimeout(syncStickyOffsets, 0); }); });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  renderApp();
  syncStickyOffsets();
  initFile();
})();
</script>
</body>
</html>
