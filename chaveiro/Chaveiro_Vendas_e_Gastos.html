<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaveiro — Vendas e Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ORGANIZAÇÃO DO CSS
     O visual foi construído em camadas (base → "Embelezamento" → v3 … v8 → Fases 1–4). A ORDEM IMPORTA: várias
     regras posteriores refinam as anteriores com o mesmo peso de seletor, então os blocos não devem ser
     reordenados. As declarações que nunca podiam vencer (sempre redefinidas mais abaixo pelo mesmo seletor) foram
     removidas na Fase 5; o que ficou em cada camada ainda tem efeito.
     Tema escuro: @media (prefers-color-scheme: dark) + :root[data-theme] (o atributo pode ser definido pelo
     ambiente que hospeda a página). */
  :root {
    
    --steel: #837A66; --danger: #A6432A;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      
      --steel: #9C9280; --danger: #E08869;
    }
  }
  :root[data-theme="dark"] {
    
    --steel: #9C9280; --danger: #E08869;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    height: 100%; margin: 0; color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 1200px; margin: 0 auto; min-height: 100%; }

  header {
    position: sticky; top: 0; z-index: 10; 
    padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 14px;
    
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px;
  }
  h1 { font-family: 'Fraunces', serif; margin: 0 0 2px; }
  .sub { color: var(--ink-soft); margin: 0; }

  .tabbar { display: flex; width: 100%; max-width: 480px; }
  .tab-btn {
    
    color: var(--ink-soft); font-weight: 600; 
    cursor: pointer; font-family: inherit;
  }
  .tab-btn.active { border-color: var(--brass); }

  .daynav { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 4px; gap: 10px; }
  .daynav button {
    border: 1px solid var(--line); color: var(--ink);
    font-size: 1.1rem; cursor: pointer;
  }
  .daynav button:disabled { opacity: 0.35; cursor: default; }
  .daylabel { text-align: center; flex: 1; }
  
  .daylabel .tag { display: inline-block; font-weight: 600; }

  .totalbar {
    margin: 12px 20px 0; 
    border: 1px solid var(--line); 
    display: flex; justify-content: space-between; align-items: center;
  }
  .totalbar .t-label { color: var(--ink-soft); }
  .totalbar .t-count { font-family: 'JetBrains Mono', monospace; font-weight: 700; }

  .card {
    margin: 16px 20px 0; border: 1px solid var(--line);
    padding: 6px 16px 16px;
  }
  .card-title { font-weight: 600; }

  .item-row { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); gap: 10px; flex-wrap: wrap; }
  .item-row:last-of-type { border-bottom: none; }
  .item-info { display: flex; flex-direction: column; gap: 2px; }
  .item-label { font-weight: 600; }
  .item-price { color: var(--ink-soft); }

  .stepper { display: flex; align-items: center; gap: 10px; }
  .step-btn {
    border: 1px solid var(--line);
    color: var(--ink); font-size: 1.15rem; cursor: pointer;
  }
  .step-btn:active { background: var(--brass-wash); }
  .step-count { font-family: 'JetBrains Mono', monospace; font-weight: 700; min-width: 20px; text-align: center; }

  .extra-fields { width: 100%; display: flex; gap: 10px; padding-top: 2px; flex-wrap: wrap; }
  .field-wrap { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 130px; }
  .field-wrap label { font-size: 0.74rem; color: var(--ink-soft); }
  .field-wrap .money-input { display: flex; align-items: center; border: 1px solid var(--line); padding: 0 10px; }
  .field-wrap .money-input span { font-size: 0.85rem; color: var(--ink-soft); margin-right: 4px; }
  .field-wrap input {
    border: none; background: none; color: var(--ink); font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem; padding: 9px 0; width: 100%; outline: none;
  }
  .field-wrap input.text-input { font-family: 'IBM Plex Sans', sans-serif; }
  .field-wrap.invalid .money-input { border-color: var(--danger); }
  .hint { font-size: 0.72rem; color: var(--danger); }
  .select-input {
    border: 1px solid var(--line); color: var(--ink);
    padding: 9px 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 0.92rem; width: 100%; outline: none;
  }

  .totals-card { margin: 16px 20px 0; border: 1px solid var(--line); }
  .totals-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
  .totals-row.discount-row input {
    border: 1px solid var(--line); color: var(--ink);
    font-family: 'JetBrains Mono', monospace; padding: 6px 8px; width: 90px; text-align: right; outline: none;
  }
  .totals-row.total-row { font-weight: 700; }
  .totals-row.total-row .val { font-family: 'JetBrains Mono', monospace; }

  .registrar-btn {
    width: 100%; margin-top: 12px; border: none; 
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .registrar-btn:disabled { cursor: default; }

  .section-title { padding: 22px 20px 6px; font-weight: 600; }

  .history { padding: 0 20px 28px; }
  .sale-item { display: flex; justify-content: space-between; gap: 10px; }
  .sale-item .s-left { display: flex; flex-direction: column; }
  .sale-item .s-time { font-family: 'JetBrains Mono', monospace; }
  .sale-item .s-desc { font-size: 0.9rem; }
  .sale-item .s-discount { font-size: 0.74rem; color: var(--brass-strong); }
  .sale-item .s-right { display: flex; align-items: center; }
  .sale-item .s-total { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .sale-item .s-del { border: none; background: none; color: var(--steel); font-size: 1rem; padding: 6px 8px; cursor: pointer; border-radius: 8px; }
  .sale-item .s-del:active { background: var(--brass-wash); color: var(--danger); }
  .empty { color: var(--ink-soft); padding: 18px 2px; text-align: center; }

  .footer-actions { padding: 6px 20px 32px; display: flex; justify-content: center; }
  .clear-btn { border: 1px solid var(--line); background: none; color: var(--ink-soft); font-size: 0.82rem; padding: 8px 14px; cursor: pointer; font-family: inherit; }
  .confirm-bar {
    margin: 0 20px 24px; padding: 12px 14px; background: var(--bg-elevated); border: 1px solid var(--danger);
    display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.85rem;
  }
  .confirm-bar .cbtns { display: flex; gap: 8px; }
  .confirm-bar button { border: none; padding: 7px 12px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; font-family: inherit; }
  .confirm-bar .yes { background: var(--danger); color: #fff; }
  .confirm-bar .no { background: var(--line); color: var(--ink); }
  .confirm-bar button:disabled { opacity: 0.4; cursor: default; }
  .confirm-bar label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
  .s-confirm-text { font-size: 0.78rem; color: var(--danger); }
  .s-confirm-btn { border: none; padding: 5px 10px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; font-family: inherit; }
  .s-confirm-btn.yes { background: var(--danger); color: #fff; }
  .s-confirm-btn.no { background: var(--line); color: var(--ink); }

  .export-msg { text-align: center; font-size: 0.82rem; color: var(--ink-soft); padding: 0 20px 20px; }
  .daynav { max-width: 520px; margin-left: auto; margin-right: auto; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
  .cols .totalbar { margin-top: 16px; }
  #resumoContent { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  #resumoContent .card-wide, #resumoContent .footer-actions, #resumoContent .export-msg { grid-column: 1 / -1; }
  .picker { position: relative; cursor: pointer; border-radius: 10px; padding: 2px 8px; user-select: none; }
  .picker:hover { background: var(--brass-wash); }
  .picker .date::after { content: ' ▾'; font-size: 0.75em; color: var(--ink-soft); }
  .picker input { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; opacity: 0; border: 0; padding: 0; pointer-events: none; }
  .mpop { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); z-index: 20; width: 260px; padding: 12px; cursor: default;
    border: 1px solid var(--line); }
  .myear { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mpop button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
  .mpop button.sel { border-color: var(--brass); }
  .mpop button:disabled { opacity: 0.35; cursor: default; }
  @media (max-width: 860px) { .cols, #resumoContent { grid-template-columns: minmax(0, 1fr); } }
  .mgrid2 { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .mcell { border: 1px solid var(--line); padding: 6px 8px; }
  .mcell.on { border-color: var(--brass); }
  .mrow { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .mname { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.85rem; }
  .mcell .stepper { gap: 6px; }
  .mcell .step-btn { width: 28px; height: 28px; font-size: 1rem; }
  .mcell .step-count { font-size: 1rem; min-width: 14px; }
  @media (min-width: 861px) { .mgrid2 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .ghead { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: none; border: none; padding: 0; color: var(--ink); font-family: inherit; cursor: pointer; text-align: left; }
  .ghead .gr { display: flex; align-items: center; gap: 8px; }
  .badge { border-radius: 999px; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; font-family: 'JetBrains Mono', monospace; }
  .chev { transition: transform .15s; }
  .chev.open { transform: rotate(90deg); }
  .mline { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; }
  .mtag { font-size: 0.74rem; color: var(--ink-soft); }
  .s-edit { border: none; background: none; color: var(--steel); font-size: 1rem; cursor: pointer; border-radius: 8px; }
  .s-edit:active { background: var(--brass-wash); color: var(--brass-strong); }
  .sale-item.editing { background: var(--brass-wash); border-radius: 10px; padding-left: 8px; padding-right: 8px; }
  .databar { margin: 10px 20px 0; padding: 10px 14px; border: 1px solid var(--danger); display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; font-size: 0.85rem; }
  .databar.ok { padding: 6px 12px; font-size: 0.78rem; }
  .databar button, .est-btn { border: 1px solid var(--brass); background: var(--brass); border-radius: 8px; padding: 6px 12px; font-family: inherit; font-size: 0.82rem; cursor: pointer; }
  
  .stk-res { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 1px solid var(--line); color: var(--ink); font-family: inherit; font-size: 0.9rem; cursor: pointer; }
  .qty { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1rem; min-width: 28px; text-align: right; }
  .qty.low { color: var(--danger); }
  .paybox { margin: 10px 0 2px; }
  .pay-opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pay-btn { border: 1px solid var(--line); color: var(--ink-soft); font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
  .pay-btn.on { border-color: var(--brass); }
  .showmore { width: 100%; border: 1px dashed var(--line); background: none; color: var(--brass-strong); padding: 8px; font-family: inherit; font-size: 0.82rem; cursor: pointer; margin-top: 8px; }

  /* ===== Embelezamento ===== */
  :root { --shadow: 0 1px 2px rgba(60,40,10,.06), 0 6px 18px rgba(60,40,10,.07); --shadow-lg: 0 10px 30px rgba(60,40,10,.14); --ok: #4F7A3A; --r: 16px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); --ok: #8DBB74; } }
  :root[data-theme="dark"] { --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); --ok: #8DBB74; }
  
  header { -webkit-backdrop-filter: blur(10px); }
  h1 { display: flex; align-items: center; gap: 10px; }
  h1 .logo { display: grid; place-items: center; background: linear-gradient(145deg, var(--brass), var(--brass-strong)); box-shadow: 0 3px 8px rgba(139,94,42,.35), inset 0 1px 0 rgba(255,255,255,.3); }
  
  .tab-btn:hover { border-color: var(--brass); color: var(--ink); }
  
  .card, .totals-card, .totalbar, .confirm-bar { border-radius: var(--r); box-shadow: var(--shadow); }
  .card-title { font-family: 'Fraunces', serif; letter-spacing: -.01em; }
  .totalbar { border-color: var(--brass); }
  .totalbar .t-count { color: var(--brass-strong); }
  .daylabel .date { font-family: 'Fraunces', serif; text-transform: none; }
  .daylabel .date::first-letter { text-transform: uppercase; }
  .daylabel .tag { background: var(--brass); padding: 1px 8px; border-radius: 99px; font-size: .66rem; }
  .daylabel .tag:empty { display: none; }
  .daynav button { transition: all .15s; box-shadow: var(--shadow); } .daynav button:hover:not(:disabled) { border-color: var(--brass); color: var(--brass-strong); }
  .step-btn { transition: all .12s; font-weight: 600; } .step-btn:hover { border-color: var(--brass); color: var(--brass-strong); } .step-btn:active { transform: scale(.92); }
  
  .step-count { transition: color .12s; } 
  .item-row { transition: background .15s; } .item-row:hover { background: color-mix(in srgb, var(--brass-wash) 35%, transparent); }
  .registrar-btn, .databar button, .est-btn { transition: all .15s; }
  
  .registrar-btn:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); } .registrar-btn:active:not(:disabled) { transform: translateY(0) scale(.99); }
  .registrar-btn:disabled { box-shadow: none; }
  .clear-btn { transition: all .15s; } .clear-btn:hover { border-color: var(--brass); color: var(--brass-strong); }
  .pay-btn { transition: all .12s; padding: 10px 2px; } .pay-btn:hover { border-color: var(--brass); } .pay-btn.on { box-shadow: 0 2px 8px rgba(139,94,42,.3); }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .field-wrap .money-input, .select-input { transition: border-color .15s, box-shadow .15s; }
  .field-wrap .money-input:focus-within, .select-input:focus { border-color: var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 22%, transparent); }
  .totals-row.discount-row input:focus { border-color: var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 22%, transparent); }
  .totals-row.total-row { font-size: 1.25rem; } .totals-row.total-row .val { color: var(--brass-strong); }
  .section-title { text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; }
  .sale-item { transition: background .15s; } .sale-item:hover { background: color-mix(in srgb, var(--brass-wash) 40%, transparent); }
  .sale-item .s-total { color: var(--brass-strong); }
  .s-discount { display: inline-block; }
  .mcell { transition: all .15s; box-shadow: 0 1px 0 rgba(0,0,0,.03); } .mcell.on { box-shadow: 0 0 0 1px var(--brass); }
  .badge { box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .databar { border-radius: var(--r); box-shadow: var(--shadow); } .databar.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .stk-res { transition: all .12s; } .stk-res:hover { border-color: var(--brass); background: var(--brass-wash); }
  .mpop { box-shadow: var(--shadow-lg); }
  .empty { border: 1px dashed var(--line); border-radius: 12px; margin: 8px 0; }
  @media (max-width: 640px) { header { padding-left: 14px; padding-right: 14px; } .card, .totals-card, .totalbar, .daynav, .history, .databar { margin-left: 12px; margin-right: 12px; } .history { padding-left: 0; padding-right: 0; } }
  @media print { header, .daynav, .tabbar, .databar { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ===== Resumo dos itens na caixa de totais ===== */
  .sel-sum { padding: 2px 0 10px; margin-bottom: 8px; border-bottom: 1px dashed var(--line); }
  .sel-title { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding-bottom: 6px; }
  .sel-line { justify-content: space-between; font-size: .92rem; }
  .sel-line .sel-q { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--brass-strong); margin-right: 6px; }
  .sel-line .sel-v { font-family: 'JetBrains Mono', monospace; font-size: .88rem; white-space: nowrap; }
  
  .sel-empty { font-size: .85rem; color: var(--ink-soft); }
  .stk-res:active { transform: scale(.99); }
  .item-row:last-of-type { border-radius: 0 0 12px 12px; }

  /* ===== Polimento v3 ===== */
  .sel-line { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 4px 10px; }
  .sel-line .sel-name { font-weight: 500; font-size: .9rem; line-height: 1.25; overflow-wrap: anywhere; }
  .sel-step { display: inline-flex; align-items: center; gap: 2px; background: var(--brass-wash); border-radius: 999px; padding: 2px; }
  .sel-step .sel-q { margin: 0; min-width: 22px; text-align: center; font-size: .95rem; color: var(--ink); }
  .sl-btn { width: 26px; height: 26px; border-radius: 50%; border: none; background: var(--bg-elevated); color: var(--brass-strong); font-size: 1.05rem; line-height: 1; cursor: pointer; font-weight: 700; box-shadow: 0 1px 2px rgba(60,40,10,.15); transition: transform .1s, background .12s; }
  .sl-btn:hover { background: var(--brass); } .sl-btn:active { transform: scale(.88); }
  .sel-line .sel-v { min-width: 74px; text-align: right; font-weight: 700; color: var(--brass-strong); }
  .sel-line .sel-v.pend { color: var(--danger); font-weight: 500; font-size: .78rem; }
  .sel-empty { text-align: center; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }
  
  .card { border-top: 3px solid var(--brass-wash); }
  .item-label { letter-spacing: -.005em; }
  
  .totalbar .t-label { text-transform: uppercase; letter-spacing: .07em; font-size: .72rem; font-weight: 600; }
  .registrar-btn:not(:disabled) { position: relative; overflow: hidden; }
  .registrar-btn:not(:disabled)::after { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.22) 50%, transparent 70%); transform: translateX(-120%); transition: transform .6s; }
  .registrar-btn:not(:disabled):hover::after { transform: translateX(120%); }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid var(--bg); }
  @media (max-width: 480px) { .sel-line { grid-template-columns: 1fr auto; } .sel-line .sel-v { grid-column: 2; grid-row: 1; } .sel-line .sel-step { grid-column: 1 / -1; justify-self: start; } }

  /* =====================================================================
     TEMA FINAL (v4) — "Oficina de latão"
     Ordem: tokens > fundo > cabeçalho > abas > cartões > itens > totais
            > botões > histórico > estoque > detalhes
     ===================================================================== */
  :root {
    
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
    --ease: cubic-bezier(.2,.8,.2,1);
  }

  /* --- fundo com textura sutil de oficina --- */
  body {
    background:
      radial-gradient(900px 420px at 100% -8%, var(--brass-wash), transparent 62%),
      radial-gradient(700px 380px at -10% 105%, color-mix(in srgb, var(--brass-wash) 70%, transparent), transparent 60%),
      repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--line) 22%, transparent) 14px 15px),
      var(--bg);
    background-attachment: fixed;
  }

  /* --- cabeçalho --- */
  header { border-bottom: none; }
  header::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, transparent, var(--brass), transparent); opacity: .7; }
  h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.02em; }
  h1 .logo { width: 42px; height: 42px; border-radius: 13px; transform: rotate(-6deg); transition: transform .3s var(--ease); }
  h1:hover .logo { transform: rotate(8deg) scale(1.06); }
  h1 .logo svg { width: 23px; height: 23px; }
  .sub { font-size: .84rem; letter-spacing: .01em; }

  /* --- abas (controle segmentado) --- */
  .tabbar { gap: 4px; padding: 4px; background: color-mix(in srgb, var(--line) 55%, var(--bg)); border-radius: 16px; box-shadow: inset 0 1px 3px rgba(60,40,10,.12); }
  .tab-btn { border: none; background: transparent; box-shadow: none; display: flex; align-items: center; justify-content: center; transition: all .2s var(--ease); }
  .tab-btn .ti { flex: none; }
  .tab-btn:hover:not(.active) { background: color-mix(in srgb, var(--bg-elevated) 70%, transparent); color: var(--ink); }
  .tab-btn.active { box-shadow: 0 4px 12px var(--glow), inset 0 1px 0 rgba(255,255,255,.3); }

  /* --- navegação de dia --- */
  .daylabel .date { font-size: 1.25rem; font-weight: 600; }
  .daylabel .tag { box-shadow: 0 2px 6px var(--glow); letter-spacing: .1em; }
  .daynav button { border-radius: 50%; width: 40px; height: 40px; background: var(--paper); }

  /* --- cartões --- */
  .card, .totals-card { background: linear-gradient(180deg, var(--paper), var(--bg-elevated)); border-radius: var(--r-lg); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.55); }
  :root[data-theme="dark"] .card, :root[data-theme="dark"] .totals-card { box-shadow: var(--shadow); }
  .card-title { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; padding: 16px 0 10px; }
  .card-title::before { content: ''; width: 4px; height: 1.1em; border-radius: 4px; background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); }
  .section-title { display: flex; align-items: center; gap: 10px; color: var(--brass-strong); }
  .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  /* --- itens da venda --- */
  .item-row { border-bottom-color: color-mix(in srgb, var(--line) 80%, transparent); padding: 13px 4px; border-radius: var(--r-sm); }
  .item-label { font-size: .98rem; }
  .item-price { font-size: .76rem; }

  .step-btn.plus { background: linear-gradient(180deg, var(--brass-wash), color-mix(in srgb, var(--brass-wash) 70%, var(--brass))); border-color: color-mix(in srgb, var(--brass) 45%, var(--line)); }
  .step-btn.plus:hover { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); border-color: transparent; }
  .step-count { font-size: 1.15rem; }

  .mcell { border-radius: var(--r-md); background: var(--paper); }
  .mcell.on { background: linear-gradient(180deg, var(--brass-wash), var(--paper)); }
  .mname { color: var(--brass-strong); }

  .chev { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--brass-wash); color: var(--brass-strong); font-size: .6rem; }
  .badge { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); }
  .field-wrap .money-input, .select-input { background: var(--paper); border-radius: var(--r-sm); }
  .field-wrap label { font-weight: 500; letter-spacing: .02em; }

  /* --- caixa de totais: estilo "nota/recibo" --- */
  .totals-card { padding: 16px 18px 18px; }
  .sel-title { color: var(--brass-strong); display: flex; align-items: center; gap: 8px; }
  .sel-title::after { content: ''; flex: 1; border-top: 1px dashed var(--line); }
  .sel-line { background: var(--paper); box-shadow: 0 1px 2px rgba(60,40,10,.06); }
  .totals-row { font-size: .95rem; }
  .totals-row.discount-row input { background: var(--paper); border-radius: var(--r-sm); }
  .totals-row.total-row { border-top: 2px dotted var(--brass); margin-top: 8px; padding-top: 14px; align-items: baseline; }
  .totals-row.total-row .val { font-size: 1.7rem; letter-spacing: -.02em; text-shadow: 0 1px 0 rgba(255,255,255,.4); }
  .totalbar { border-radius: var(--r-lg); padding: 14px 18px; position: relative; overflow: hidden; }
  .totalbar::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); }
  .totalbar .t-count { font-size: 1.65rem; letter-spacing: -.02em; }

  /* --- botões --- */
  .registrar-btn { border-radius: var(--r-md); padding: 15px; font-size: 1.02rem; letter-spacing: .02em; box-shadow: 0 6px 16px var(--glow), inset 0 1px 0 rgba(255,255,255,.3); text-shadow: 0 1px 1px rgba(0,0,0,.18); }
  .registrar-btn:disabled { background: color-mix(in srgb, var(--line) 80%, var(--bg)); text-shadow: none; }
  .pay-btn { border-radius: var(--r-sm); background: var(--paper); }
  
  .clear-btn, .est-btn, .showmore { border-radius: var(--r-sm); }
  .est-btn { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); border-color: transparent; }
  .est-btn.alt { background: transparent; border: 1px solid var(--brass); }

  /* --- histórico / listas --- */
  .sale-item { border-radius: var(--r-md); border-bottom: 1px dashed var(--line); }
  .sale-item .s-time { background: var(--brass-wash); color: var(--brass-lo); padding: 1px 7px; border-radius: 99px; width: fit-content; font-size: .7rem; }
  .sale-item .s-total { font-size: 1.05rem; }
  .s-discount { background: color-mix(in srgb, var(--brass-wash) 70%, transparent); padding: 1px 8px; border-radius: 99px; font-size: .7rem; width: fit-content; }
  .s-edit, .s-del { width: 32px; height: 32px; display: inline-grid; place-items: center; padding: 0; }
  .s-edit:hover { background: var(--brass-wash); color: var(--brass-strong); } .s-del:hover { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .empty { background: color-mix(in srgb, var(--brass-wash) 25%, transparent); font-size: .88rem; }
  .stk-res { border-radius: var(--r-sm); background: var(--paper); }

  /* --- barra de dados, popover, foco --- */
  .databar { background: linear-gradient(135deg, var(--paper), var(--bg-elevated)); }
  .mpop { border-radius: var(--r-lg); background: var(--paper); }
  .mpop button.sel { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); }
  ::selection { background: var(--brass); color: #fff; }
  .item-info { flex: 1 1 0; min-width: 0; } .item-label { overflow-wrap: anywhere; }
  .step-btn.plus { color: var(--brass-strong); }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  /* =====================================================================
     VISUAL v5 — "Oficina de latão" (nav flutuante, hero, blocos, recibo)
     ===================================================================== */
  :root { --bg:#F3ECDD; --bg-elevated:#FFFBF2; --paper:#FFFBF2; --ink:#2A2118; --ink-soft:#85775F; --brass:#B8863B; --brass-strong:#6E4817; --brass-wash:#F1E3C4; --line:#E5D8BD; --brass-hi:#E3B965; --brass-lo:#B8863B; --glow:rgba(184,134,59,.35); --on-gold:#2A2118; --hero:linear-gradient(135deg,#2A2118,#4A3418 60%,#7A5624); --heroInk:#FFF4DA; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14110D; --bg-elevated:#1F1A13; --paper:#1F1A13; --ink:#F3E9D2; --brass:#E3B965; --brass-strong:#F6D88F; --brass-wash:#3A2D18; --line:#33291B; --brass-hi:#F6D88F; --brass-lo:#E3B965; --glow:rgba(227,185,101,.3); --hero:linear-gradient(135deg,#2B2113,#47321A 60%,#8A6528); } }
  :root[data-theme="dark"] { --bg:#14110D; --bg-elevated:#1F1A13; --paper:#1F1A13; --ink:#F3E9D2; --brass:#E3B965; --brass-strong:#F6D88F; --brass-wash:#3A2D18; --line:#33291B; --brass-hi:#F6D88F; --brass-lo:#E3B965; --glow:rgba(227,185,101,.3); --hero:linear-gradient(135deg,#2B2113,#47321A 60%,#8A6528); }
  .tab-btn.active, .registrar-btn, .pay-btn.on, .est-btn, .badge, .mpop button.sel, .daylabel .tag, .databar button, h1 .logo, .step-btn.plus:hover, .sl-btn:hover, .registrar-btn:disabled { color: var(--on-gold); }
  .registrar-btn:disabled { color: var(--ink-soft); }
  .est-btn.alt { color: var(--brass-strong); }
  .badge[style] { color: #fff; }
  #app { padding-bottom: 110px; }
  header { -webkit-backdrop-filter: none; }

  /* nav flutuante */
  header .tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: auto; max-width: none; z-index: 30; padding: 6px; gap: 4px; border-radius: 22px; background: color-mix(in srgb, var(--bg-elevated) 84%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: 0 18px 40px -10px rgba(0,0,0,.45); }
  .tab-btn { flex: none; flex-direction: column; gap: 2px; padding: 8px 16px; font-size: .68rem; border-radius: 16px; }
  .tab-btn .ti { display: block !important; width: 20px; height: 20px; }

  /* hero */
  .hero { position: relative; overflow: hidden; margin: 16px 20px 0; border-radius: 28px; background: var(--hero); color: var(--heroInk); padding: 22px var(--hero-px) 0; box-shadow: var(--shadow); --hero-px: 24px; }
  .hero::before { content: ''; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, #ffd98a55, transparent 70%); pointer-events: none; }
  .hero small { letter-spacing: .14em; text-transform: uppercase; font-size: .7rem; opacity: .78; }
  .hero .big { font-family: 'Fraunces', serif; font-weight: 800; font-size: clamp(2.6rem, 9vw, 4rem); line-height: 1.05; letter-spacing: -.04em; margin: 6px 0 2px; }
  .pays { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; min-height: 8px; }
  .pays div { background: rgba(0,0,0,.28); border-radius: 12px; padding: 8px 12px; font-size: .78rem; }
  .pays b { display: block; font-family: 'JetBrains Mono', monospace; font-size: .95rem; }
  .spark { display: block; width: calc(100% + 2 * var(--hero-px)); margin: 10px calc(-1 * var(--hero-px)) 0; height: 84px; }
  .spark-cap { position: absolute; right: 18px; bottom: 8px; font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }

  /* blocos de produto */
  #saleFormWrap .card { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  #saleFormWrap .card > * { grid-column: 1 / -1; }
  #saleFormWrap .card > .tile-row { grid-column: auto; }
  .card > .tile-row { display: flex; justify-content: flex-start; gap: 0; }
  .card > .tile-row:hover { border-color: var(--brass); }
  
  .tile-row.on .ico { background: linear-gradient(145deg, var(--brass-hi), var(--brass-lo)); color: var(--on-gold); }
  
  .tile-row .stepper { justify-content: space-between; border-radius: 99px; }
  

  /* recibo */
  .totals-card { border-radius: 24px 24px 0 0; margin-bottom: 28px; background: var(--bg-elevated); border-top: 5px solid var(--brass); }
  .totals-card::after { content: ''; position: absolute; left: 0; right: 0; bottom: -12px; height: 12px; background: linear-gradient(-45deg, transparent 8px, var(--bg-elevated) 0), linear-gradient(45deg, transparent 8px, var(--bg-elevated) 0); background-size: 16px 16px; background-position: left bottom; }
  
  .registrar-btn, .pay-btn.on, .tab-btn.active { background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); }
  .totalbar { background: var(--bg-elevated); }

  /* aviso */
  .toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -110px); background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 99px; font-weight: 600; box-shadow: 0 12px 30px rgba(0,0,0,.35); transition: transform .35s cubic-bezier(.2,.9,.3,1.3); z-index: 50; pointer-events: none; }
  .toast.show { transform: translate(-50%, 0); }
  .step-btn.plus:hover { color: var(--on-gold) !important; }
  .databar { margin-top: 14px; }
  @media (max-width: 640px) { .hero { margin-left: 12px; margin-right: 12px; } }

  /* =====================================================================
     v6 — produtos em lista compacta + painel de busca do estoque
     ===================================================================== */
  #saleFormWrap .card { display: block; padding: 6px 16px 14px; }
  .card > .tile-row { flex-direction: row; flex-wrap: wrap; align-items: center; background: transparent; border: none; border-bottom: 1px dashed var(--line); border-radius: 12px; box-shadow: none; padding: 9px 6px; transition: background .15s; }
  .card > .tile-row:hover { transform: none; background: color-mix(in srgb, var(--brass-wash) 45%, transparent); }
  .card > .tile-row.on { box-shadow: none; border-color: var(--line); background: color-mix(in srgb, var(--brass-wash) 70%, transparent); }
  .tile-row .ico, .stk-sel .ico { width: 34px; height: 34px; border-radius: 11px; margin: 0 12px 0 0; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--brass) 16%, transparent); color: var(--brass-strong); }
  .tile-row .ico svg, .stk-sel .ico svg { width: 18px; height: 18px; }
  .tile-row .item-info, .stk-sel .item-info { flex: 1 1 0; min-width: 0; }
  .tile-row .stepper { margin: 0; padding: 2px; background: color-mix(in srgb, var(--brass) 12%, transparent); }
  .tile-row .step-btn { width: 30px; height: 30px; }
  .tile-row .extra-fields { margin-top: 8px; padding-left: 46px; }
  .stk-sel { background: color-mix(in srgb, var(--brass-wash) 70%, transparent); border-radius: 12px; border: 1px solid var(--brass) !important; margin: 6px 0; padding: 9px 8px !important; flex-wrap: nowrap; align-items: center; }

  .stk-panel { padding: 8px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .stk-tip { font-size: .8rem; color: var(--ink-soft); margin: 0 0 10px; } .stk-tip b { color: var(--brass-strong); }
  .stk-grid { display: grid; gap: 10px; }
  .stk-box { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 10px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
  .stk-box:focus-within { border-color: var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 22%, transparent); }
  .stk-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .stk-head .ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(145deg, var(--brass-hi), var(--brass-lo)); color: var(--on-gold); flex: none; }
  .stk-head .ico svg { width: 17px; height: 17px; }
  .stk-head b { display: block; font-size: .92rem; line-height: 1.1; } .stk-head small { color: var(--ink-soft); font-size: .72rem; }
  .stk-input { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 0 10px; color: var(--brass); }
  .stk-input input { border: none; background: none; outline: none; color: var(--ink); font: inherit; font-size: .9rem; padding: 10px 0; width: 100%; min-width: 0; }
  .stk-list { margin-top: 6px; max-height: 280px; overflow-y: auto; }
  .stk-list:empty { display: none; }
  .stk-res { margin-top: 6px; border-left: 3px solid var(--brass); padding: 8px 10px; }
  .stk-res:first-child { margin-top: 0; }

  .r-meta { display: flex; align-items: center; gap: 8px; flex: none; }
  .r-price { font-family: 'JetBrains Mono', monospace; font-size: .78rem; color: var(--ink-soft); }
  .r-qty { font-size: .7rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: color-mix(in srgb, var(--ok, #4F7A3A) 18%, transparent); color: var(--ok, #4F7A3A); white-space: nowrap; }
  .r-qty.low { background: color-mix(in srgb, #D49A1E 20%, transparent); color: #A06A00; } .r-qty.out { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .r-add { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: linear-gradient(145deg, var(--brass-hi), var(--brass-lo)); color: var(--on-gold); }
  .stk-res:hover .r-add { transform: scale(1.12); }
  @media (max-width: 640px) { .tile-row .extra-fields { padding-left: 0; } }
  .stk-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stk-box:first-child { grid-column: 1 / -1; }
  @media (max-width: 1040px) and (min-width: 641px) { .stk-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .stk-grid { grid-template-columns: minmax(0, 1fr); } }
  .stk-res { flex-direction: column; align-items: stretch; gap: 4px; }
  .stk-res .r-meta { justify-content: flex-start; flex-wrap: wrap; }
  .stk-res .r-add { margin-left: auto; }
  .stk-res .r-name { width: 100%; text-align: left; }

  /* ===== v7 — meta, favoritos, gráficos, lista de compras, desfazer ===== */
  .goal { margin-top: 14px; padding-bottom: 6px; font-size: .8rem; }
  .goal:empty { display: none; }
  .g-top { display: flex; justify-content: space-between; align-items: baseline; opacity: .9; }
  .g-top b { font-family: 'JetBrains Mono', monospace; font-size: 1rem; }
  .g-bar { height: 10px; border-radius: 99px; background: rgba(0,0,0,.35); overflow: hidden; margin: 6px 0; }

  .g-bar i.done { background: linear-gradient(90deg, #A8E08A, #6DBE5B); box-shadow: 0 0 12px rgba(140,224,120,.6); }

  .spark { margin-top: 4px; }

  .fav { margin: 8px 0 4px; padding: 10px 0 12px; border-bottom: 1px solid var(--line); }

  .fav-chip small { background: var(--brass-wash); color: var(--brass-strong); border-radius: 99px; padding: 2px 8px; font-family: 'JetBrains Mono', monospace; font-size: .7rem; }
  .fav-chip:hover { border-color: var(--brass); transform: translateY(-1px); } .fav-chip:active { transform: scale(.96); background: var(--brass-wash); }

  .chart { width: 100%; height: 130px; display: block; margin-top: 6px; }
  .chart-leg { display: flex; gap: 14px; flex-wrap: wrap; font-size: .72rem; color: var(--ink-soft); margin-top: 6px; }

  .insight { background: var(--brass-wash); border-radius: 12px; padding: 10px 12px; margin: 4px 0 10px; font-size: .9rem; }

  .hb i { width: 100%; border-radius: 6px 6px 2px 2px; background: color-mix(in srgb, var(--brass) 45%, var(--line)); transition: height .4s; }
  .hb.top i { background: linear-gradient(var(--brass-hi), var(--brass-lo)); box-shadow: 0 0 10px var(--glow); }
  .hb span { font-size: .62rem; color: var(--ink-soft); }

  .buy-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #buyWa { background: linear-gradient(180deg, #4FD27A, #2FA95B); color: #fff; }

  .toast { display: flex; align-items: center; gap: 14px; }
  .toast.has-undo { pointer-events: auto; padding-right: 10px; }
  .t-undo { border: none; background: var(--brass-hi); color: var(--on-gold); font-family: inherit; padding: 7px 14px; border-radius: 99px; cursor: pointer; }
  .t-undo:hover { filter: brightness(1.08); }
  /* ===== v8 — guias e dicas ===== */

  .mini { color: var(--ink-soft); font-size: .72rem; }

  /* ===== v8 — barra de dia fixa, compactação 1366×768 e lista de "Outros" ===== */
  .outros-row { grid-column: 1 / -1 !important; }
  .outros-list { display: flex; flex-direction: column; gap: 8px; }
  .outro-line { display: grid; grid-template-columns: minmax(0, 1fr) 128px auto auto; gap: 8px; align-items: end; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
  .outro-line .field-wrap { margin: 0; min-width: 0; }

  @media (max-width: 640px) {

  }
  /* ===== Fase 1 — estados de erro (integridade dos dados) ===== */
  .reg-hint.err { color: var(--danger); font-weight: 600; } .reg-hint.err::before { content: '⚠ '; color: var(--danger); }

  .databar button.alt { background: transparent; color: var(--brass-strong); }
  /* ===== Fase 3 — fluxos ===== */
  .day-warn { margin: 6px 20px 0; padding: 10px 14px; border: 1px solid var(--danger); border-radius: 12px; background: var(--bg-elevated); font-size: .85rem; }
  .day-warn button { margin-left: 8px; border: 1px solid var(--brass); background: var(--brass); color: var(--on-gold, #fff); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: .8rem; cursor: pointer; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; display: grid; place-items: center; padding: 16px; }
  .modal-bg[hidden] { display: none; }
  .modal { background: var(--bg-elevated); color: var(--ink); border-radius: 16px; padding: 18px; max-width: 420px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .modal p { margin: 0 0 14px; line-height: 1.45; }

  .modal-btns { display: flex; gap: 8px; } .modal-btns > * { flex: 1; margin: 0 !important; width: auto !important; }
  .stk-sel.need-price { flex-wrap: wrap; } .stk-sel.need-price .extra-fields { padding-left: 46px; }
  .stk-nostock { margin-top: 6px; border: none; background: none; color: var(--brass-strong); text-decoration: underline; font: inherit; font-size: .8rem; cursor: pointer; }
  .tag-off { font-size: .68rem; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--line); color: var(--ink-soft); }
  .sl-btn:disabled, .step-btn:disabled { opacity: .35; cursor: default; }
  @media (max-width: 640px) { .day-warn { margin-left: 12px; margin-right: 12px; } .stk-sel.need-price .extra-fields { padding-left: 0; } }
  /* =====================================================================
     Fase 4 — layout, responsividade e 1366×768 (mesma identidade visual)
     - um único header sticky: marca + navegação de dia/mês + abas (desktop); no celular as abas
       continuam na barra flutuante inferior;
     - só o recibo da venda é sticky (desktop), preso à área da venda; cards comuns nunca são sticky;
     - listas sem rolagem interna (a paginação da Fase 2 já limita o tamanho).
     ===================================================================== */
  :root:not([data-theme="dark"]) { --ink-soft: #746650; --pix: #17695D; }   /* texto secundário com contraste AA (4,75:1 no fundo) */
  :root:not([data-theme="dark"]) .sale-item .s-time { color: var(--brass-strong); }   /* etiqueta de horário: 6,3:1 no claro (no escuro, 9,6:1) */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink-soft: #A89B82; --pix: #6FD0BF; } }
  :root[data-theme="dark"] { --ink-soft: #A89B82; --pix: #6FD0BF; }
  html { scroll-padding-top: calc(var(--stick-top, 96px) + 10px); }

  /* --- header: fundo translúcido que vai de ponta a ponta, sem faixa dura --- */
  /* o fundo (translúcido, com desfoque) é um pseudo-elemento de ponta a ponta da janela; o conteúdo segue no #app */
  header { background: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
  /* O cabeçalho é sticky no topo em todas as larguras: o fundo se ancora na janela (left/right 0 excluem a barra de
     rolagem). 100vw incluía a barra e passava da página no Windows; antes isso era escondido com overflow-x: clip. */
  header::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: var(--stick-top, 64px); z-index: -1; pointer-events: none;
    background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 1px 0 var(--line), 0 10px 24px -18px rgba(60,40,10,.35); }
  header .brand { min-width: 0; }
  header .daynav { position: static; z-index: auto; background: transparent; margin: 0; max-width: none; padding: 0; gap: 8px; }
  .daylabel { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }

  .day-warn { margin-top: 10px; }

  @media (min-width: 861px) {

    header .daynav button { width: 34px; height: 34px; }

    /* abas integradas ao header (não flutuam sobre o formulário) */

      background: color-mix(in srgb, var(--line) 55%, var(--bg)); box-shadow: inset 0 1px 3px rgba(60,40,10,.12); backdrop-filter: none; -webkit-backdrop-filter: none; }
    .tab-btn { flex-direction: row; gap: 6px; padding: 7px 12px; font-size: .82rem; border-radius: 11px; }

  @media (max-width: 860px) {

    header .brand { flex: 1 1 auto; }

  }
  @media (max-width: 860px) { #saleTotalsWrap .totals-card { margin-bottom: 26px; } }

  /* --- histórico do dia: largura total, logo abaixo da venda --- */
  .hist-area { margin-top: 4px; }
  .hist-head { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding: 18px 20px 6px; }
  .hist-head .section-title { padding: 0; flex: 1 1 auto; }
  .hist-search { flex: 0 1 380px; min-width: 220px; }
  .hist-search input { padding: 8px 0; }
  .history { padding-bottom: 12px; }
  @media (min-width: 1100px) {
    #history { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; align-items: start; }

  }
  @media (max-width: 640px) { .hist-head { padding: 16px 12px 6px; } .hist-search { flex: 1 1 100%; min-width: 0; } }

  /* --- linhas do histórico: leitura fácil, valores alinhados, ações discretas --- */

  .sale-item .s-total { min-width: 86px; text-align: right; font-variant-numeric: tabular-nums; }

  .sale-item .s-items { font-size: .8rem; color: var(--ink-soft); line-height: 1.35; overflow-wrap: anywhere; }
  /* celular: valor em cima e ações embaixo, numa coluna estreita — a descrição ganha largura */

  @media (max-width: 640px) { .sale-item .s-right { flex-wrap: wrap; justify-content: flex-end; width: 92px; row-gap: 0; } .sale-item .s-total { min-width: 0; width: 100%; } }

  .est-side .totalbar { margin-top: 16px; }

  @media (max-width: 640px) { .est-tools #estNew { flex: 1 1 100%; } }

  .resumo-strip div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

  .resumo-strip .saldo b { color: var(--brass-strong); }

  @media (max-width: 640px) { .resumo-strip { grid-template-columns: 1fr 1fr; } .resumo-strip .saldo { grid-column: 1 / -1; } .resumo-strip b { font-size: 1.15rem; } }

  /* =====================================================================
     Fase 8 consolidada — recursos incorporados ao visual da Fase 7
     (balcão de comandos, tema, barra da venda no celular, dias clicáveis, níveis do estoque, calendário,
      idade do fiado, ajustes de responsividade). Usa só os tokens e o vocabulário visual da Fase 7.
     ===================================================================== */
  /* --- cabeçalho: busca (Ctrl+K) e tema, no mesmo estilo dos botões de dia --- */
  .hd-tools { display: flex; align-items: center; gap: 6px; }
  .hd-btn { height: 34px; min-width: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 10px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); cursor: pointer; font-family: inherit; font-size: .8rem; font-weight: 600; box-shadow: var(--shadow); transition: all .15s; }
  .hd-btn:hover { border-color: var(--brass); color: var(--brass-strong); }

  @media (min-width: 861px) {

  @media (max-width: 860px) { .hd-btn .hd-lbl, .hd-btn kbd { display: none; } .hd-btn { width: 38px; height: 38px; } header .hd-tools { order: 2; } header .daynav { order: 3; } }

  /* --- balcão de comandos (Ctrl+K) --- */
  .cmd-bg { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: flex; justify-content: center; align-items: flex-start; padding: 10vh 12px 12px; }

  .cmd-in { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--brass); }

  .cmd-foot { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 14px; border-top: 1px solid var(--line); font-size: .72rem; color: var(--ink-soft); }

  /* --- seletor de data: o campo nativo fica fora do botão (acessibilidade), centralizado sob ele --- */

    .card-fat > .cal-wrap .cal-t { margin-top: 0; padding-top: 0; border-top: 0; }
    .card-fat > .chart { height: 186px; }   /* acompanha a altura do calendário ao lado */
  }
  /* --- herói: "Últimos 7 dias" numa pílula — a linha do gráfico não passa mais por cima do texto --- */
  .spark-cap { z-index: 2; pointer-events: none; bottom: 7px; padding: 2px 9px; border-radius: 99px; background: rgba(20,14,6,.42); opacity: .9; }

  /* --- exportação: Excel (principal) + CSV simples --- */
  #resumoContent .footer-actions { gap: 10px; flex-wrap: wrap; align-items: center; }

  /* --- retrato do ano --- */
  #resumoContent > .retrato { grid-column: 1 / -1; }
  .retrato > summary { cursor: pointer; list-style: none; } .retrato > summary::-webkit-details-marker { display: none; }
  .retrato > summary::after { content: ' ▸'; color: var(--ink-soft); } .retrato[open] > summary::after { content: ' ▾'; }
  .retrato-g { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
  .retrato-g .pulse-c b { font-family: 'JetBrains Mono', monospace; font-size: 1rem; }
  .retrato-g .pulse-c small { font-size: .68rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .retrato-c { font-size: .88rem; margin-bottom: 4px; }

  /* --- comprar: vão acabar em breve --- */
  .buy-soon { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
  /* linhas do Comprar: nome em cima, números embaixo (com o ritmo de vendas a linha ficou longa demais lado a lado) */
  .card-buy .totals-row { flex-direction: column; align-items: flex-start; gap: 1px; padding: 6px 0; }
  .card-buy .totals-row > span:last-child { font-size: .8rem; color: var(--ink-soft); }
  .card-buy .totals-row > span:last-child b { color: var(--ink); }
  .buy-soon-t { font-weight: 700; font-size: .9rem; color: var(--brass-strong); }

  /* --- herói: comparação com a semana anterior · estoque: valor --- */
  .day-cmp { font-size: .76rem; opacity: .9; margin-top: 2px; }
  .day-cmp b { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .day-cmp .up { color: #B6E79A; } .day-cmp .down { color: #FFB59E; } .day-cmp .eq { color: var(--heroInk); }
  .totalbar .t-val { display: block; margin-top: 2px; font-size: .74rem; letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--ink-soft); }
  .a12-b:first-child .a12-v { left: 0; right: -40px; text-align: left; } .a12-b:last-child .a12-v { left: -40px; right: 0; text-align: right; }

  /* --- resumo: últimos 12 meses --- */
  #resumoContent > .card-ano { grid-column: 1 / -1; }
  .a12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
  .a12-b { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 5px; padding: 20px 0 4px; border: 0; background: none; border-radius: 8px;
    cursor: pointer; font-family: inherit; color: var(--ink-soft); min-width: 0; transition: background .12s; }
  .a12-b:hover { background: var(--brass-wash); }
  .a12-c { position: relative; display: block; height: 118px; }
  .a12-c i { position: absolute; bottom: 0; left: 0; right: 0; margin: 0 auto; width: min(24px, 70%); height: var(--h); border-radius: 4px 4px 0 0;
    background: color-mix(in srgb, var(--brass) 45%, var(--line)); }
  .a12-b.on .a12-c i { background: linear-gradient(var(--brass-hi), var(--brass-lo)); box-shadow: 0 0 10px var(--glow); }
  .a12-v { position: absolute; left: -22px; right: -22px; bottom: calc(var(--h) + 4px); text-align: center; font-family: 'JetBrains Mono', monospace; font-size: .64rem; font-weight: 700; color: var(--ink); white-space: nowrap; pointer-events: none; }
  .a12-b small { text-align: center; font-size: .66rem; text-transform: capitalize; }
  .a12-b.on small { color: var(--ink); font-weight: 700; }
  .a12-b::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 2px); transform: translateX(-50%); white-space: nowrap; padding: 5px 10px; border-radius: 8px;
    background: var(--ink); color: var(--bg); font-size: .72rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 3; }
  .a12-b.ini::after { left: 0; transform: none; } .a12-b.fim::after { left: auto; right: 0; transform: none; }
  .a12-b:hover::after, .a12-b:focus-visible::after { opacity: 1; }
  .a12-n { padding-top: 8px; }
  @media (max-width: 640px) { .a12 { gap: 2px; } .a12-c { height: 96px; } .a12-b small { font-size: .58rem; } }

  /* --- WhatsApp: comprovante, lembrete de fiado, resumo do dia --- */
  .s-wa { border: none; background: none; color: var(--steel); cursor: pointer; border-radius: 8px; width: 32px; height: 32px; display: inline-grid; place-items: center; padding: 0;
    opacity: .6; transition: opacity .15s, background .15s, color .15s; }

  .wa-lembra, .hist-share { display: inline-flex; align-items: center; gap: 6px; border: 1px solid color-mix(in srgb, #25D366 45%, var(--line)); background: var(--paper); color: #127A42;
    border-radius: 99px; padding: 6px 12px; min-height: 32px; font-family: inherit; font-size: .78rem; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s; }

    #history .sale-item .s-right { width: 96px; column-gap: 3px; } }

  /* --- recorde e celebração --- */
  .rec-badge { display: inline-block; margin-left: 8px; padding: 2px 9px; border-radius: 99px; font-size: .68rem; font-weight: 700; letter-spacing: .02em;
    background: linear-gradient(180deg, #FFE6A8, #E8B652); color: #3A2708; box-shadow: 0 2px 10px rgba(255,200,90,.35); vertical-align: 2px; }
  .rec-badge[hidden] { display: none; }
  @media (max-width: 860px) { .rec-badge { display: table; margin: 6px 0 0; } }   /* no celular, em linha própria e alinhado ao rótulo */
  .celebra { position: fixed; left: 50%; top: calc(var(--stick-top, 64px) + 72px); transform: translateX(-50%); z-index: 81; pointer-events: none;
    padding: 12px 22px; border-radius: 22px; font-weight: 700; font-size: 1rem; text-align: center; width: max-content; max-width: calc(100% - 32px);   /* fixed: 100% = janela sem a barra de rolagem */
    background: linear-gradient(180deg, var(--brass-hi), var(--brass-lo)); color: var(--on-gold); box-shadow: 0 16px 40px -8px rgba(0,0,0,.45), 0 0 0 3px color-mix(in srgb, var(--brass) 30%, transparent); }
  .confete { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 80; pointer-events: none; }
  h1 .logo svg { transform-origin: 50% 50%; }

  /* --- pulso do mês (faixa do Resumo) e ritmo da meta (herói) --- */
  .resumo-strip .pulse { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; gap: 8px; padding-top: 12px; margin-top: 2px; border-top: 1px dashed var(--line); }
  .pulse-c { display: flex; flex-direction: column; gap: 1px; flex: 1 1 150px; min-width: 0; padding: 8px 12px; border-radius: var(--r-sm); background: var(--brass-wash); }
  .resumo-strip .pulse-c b { font-size: 1.02rem; }
  .pulse-c i { font-style: normal; font-size: .7rem; }
  .resumo-strip .pulse-c small, .pulse-c i { color: color-mix(in srgb, var(--ink) 78%, transparent); }   /* texto secundário legível sobre o fundo dourado (AA) */
  .pulse-c.meta { background: color-mix(in srgb, var(--brass) 18%, var(--paper)); }
  .pulse-c.ok b { color: var(--ok); }
  .g-pace { margin-top: 4px; font-size: .74rem; opacity: .82; }

  /* --- troco (pagamento em dinheiro) --- */
  .troco { margin-top: 10px; padding: 10px 12px 12px; border-radius: var(--r-md); background: var(--brass-wash); border: 1px dashed color-mix(in srgb, var(--brass) 45%, transparent);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: end; }
  .troco .field-wrap { min-width: 0; } .troco .field-wrap label { color: var(--brass-strong); font-weight: 600; }
  .troco-r { text-align: right; min-width: 96px; padding-bottom: 4px; }
  .troco-r span { display: block; font-size: .66rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  .troco-r b { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; color: var(--ok); }
  .troco-r b.vazio { color: var(--ink-soft); opacity: .6; } .troco-r .falta { color: var(--danger); }
  .troco-q { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .troco-q:empty { display: none; }
  .troco-b { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 99px; padding: 6px 12px; min-height: 32px;
    font-family: 'JetBrains Mono', monospace; font-size: .8rem; cursor: pointer; transition: border-color .12s, transform .1s; }

  /* --- fiado: idade da dívida --- */
  .f-age { font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: var(--ink-soft); }
  .f-age.old { color: var(--danger); font-weight: 700; }
</style>

<script>
(function () {
  /* ÍNDICE DO CÓDIGO (na ordem do arquivo)
     1. Configuração ........ categorias, baterias/pilhas, serviços, formas de pagamento, chaves do localStorage
     2. Estado da tela ...... dia/mês absolutos, formulário da venda, edição em andamento, rascunho do gasto
     3. Dados ............... cache em memória (somente leitura) + índices: Map de produtos, vendas/gastos por dia/mês
     4. Gravação segura ..... commit() tudo-ou-nada, leitura tolerante, validação/normalização, merge de backups
     5. Datas e dinheiro .... dayKey/parseDay/fmt*, money(), parseMoney()
     6. Aba Vendas .......... cálculo e validação, resumo da venda, blocos do formulário, registrar/editar/remover,
                              histórico do dia
     7. Aba Gastos .......... formulário (com rascunho) e histórico
     8. Relatório CSV
     9. Estoque ............. busca na venda (relevância) e aba Estoque (lista paginada, formulário, entradas)
    10. Arquivo de dados .... sincronização em 3 vias com o arquivo, conflito, barra de avisos
    11. Venda (apoio) ....... pagamento, desfazer granular, confirmação, avisos, meta, mais vendidos, gráficos
    12. Resumo .............. fiado e recebimentos, backup/restore, resumo do mês
    13. Navegação ........... renderApp, dia/mês, virada do dia, limpar o dia, seletores, inicialização
    Diagnóstico: window.__chaveiroFreeze (só testes) congela o cache para provar que nada o altera diretamente. */
  var CATEGORIES = [
    { id: 'simples', label: 'Chave Simples', price: 14 },
    { id: 'tetra', label: 'Tetra', price: 35 },
    { id: 'moto', label: 'Moto', price: 50 },
    { id: 'carro', label: 'Carro', price: null },
    { id: 'outros', label: 'Outros', price: null }
  ];
  var GENERIC_KEYS = { simples: 1, tetra: 1, moto: 1 }; // itens genéricos de chave (não são produtos do estoque)
  var PRECO_AVULSO = 20, PRECO_TROCA = 30;
  // Controle clonável: item rápido VINCULADO ao produto do estoque (categoria "Controle de portão", marca "Controle
  // clonavel", achado pelo nome, sem ID fixo). Vende a R$ 80,00 sem mudar o preço cadastrado; baixa/devolve estoque
  // pelo mesmo caminho dos produtos do estoque (stockItems).
  var PRECO_CLONAVEL = 80;
  function cloneProd() {
    var n = function (s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); };
    var all = estIndex().src.filter(function (x) { return n(x.cat) === 'controle de portao' && n(x.marca) === 'controle clonavel'; });
    return all.filter(function (x) { return !x.inativo; })[0] || all[0] || null;
  }

    var now = new Date(), cur = new Date(+viewMonth.slice(0, 4), +viewMonth.slice(5, 7) - 1, 1);
    var h = '<div class="myear"><button data-y="-1">‹</button><b>' + pickYear + '</b><button data-y="1"' + (pickYear >= now.getFullYear() ? ' disabled' : '') + '>›</button></div><div class="mgrid">';
    MESES.forEach(function (m, i) {
      var future = pickYear > now.getFullYear() || (pickYear === now.getFullYear() && i > now.getMonth());
      var sel = pickYear === cur.getFullYear() && i === cur.getMonth();
      h += '<button data-m="' + i + '"' + (future ? ' disabled' : '') + (sel ? ' class="sel"' : '') + '>' + m + '</button>';
    });
    monthPop.innerHTML = h + '</div>';
  }
  document.getElementById('monthBtn').addEventListener('click', function () {
    if (monthPop.hidden) { pickYear = +viewMonth.slice(0, 4); renderMonthPop(); monthPop.hidden = false; }
    else { monthPop.hidden = true; }
    this.setAttribute('aria-expanded', String(!monthPop.hidden));
  });
  monthPop.addEventListener('click', function (ev) {
    ev.stopPropagation();
    var b = ev.target.closest('button');
    if (!b || b.disabled) return;
    if (b.getAttribute('data-y')) { pickYear += parseInt(b.getAttribute('data-y'), 10); renderMonthPop(); }
    else if (b.getAttribute('data-m')) {
      viewMonth = pickYear + '-' + String(parseInt(b.getAttribute('data-m'), 10) + 1).padStart(2, '0');
      monthPop.hidden = true; document.getElementById('monthBtn').setAttribute('aria-expanded', 'false');
      renderApp();
    }
  });
  // O quadro de meses fica FORA do botão (botões dentro de botão confundem o leitor de tela: axe nested-interactive).
  document.addEventListener('click', function (ev) { if (!ev.target.closest('#monthBtn, #monthPop')) { monthPop.hidden = true; document.getElementById('monthBtn').setAttribute('aria-expanded', 'false'); } });

  (function () {
    document.getElementById('saleTotalsWrap').addEventListener('click', function (ev) {
      var b = ev.target.closest('.sl-btn'); if (!b) return;
      var d = b.classList.contains('sl-plus') ? 1 : -1, sp = b.getAttribute('data-sp'), sc = b.getAttribute('data-sc'), so = b.getAttribute('data-so');
      // Mesmo caminho dos botões do formulário: atualiza só o bloco afetado + totais.
      if (b.hasAttribute('data-so-del')) { outrosList.splice(+b.getAttribute('data-so-del'), 1); refreshOutros(); return; }
      if (so !== null && outrosList[+so]) { outrosList[+so].qty = Math.max(1, outrosList[+so].qty + d); refreshOutros(); } // "−" nunca remove: remover é só no 🗑
      else if (sp && stockItems[sp]) changeStock(sp, d);
      else if (sc && itemState[sc]) changeCat(sc, d);
    });
  })();
  document.addEventListener('click', function (ev) {
    if (!ev.target.closest('[data-goal]')) return;
    var cur = loadMeta(), v = prompt('Meta de faturamento mensal (R$) — é um valor só, usado em todos os meses:', cur ? String(cur).replace('.', ',') : '');
    if (v === null) return;
    var n = parseMoney(v.trim() === '' ? '0' : v);
    if (isNaN(n) || n < 0) { showToast('Meta inválida. Digite só o número, ex: 20000 ou 20.000.', false, true); return; }
    if (saveMeta(n)) renderApp();
  });
  // A navegação de dia/mês fica dentro do header: a área fixa no topo é só a altura real do header.
  function syncStickyOffsets() {
    var h = document.querySelector('header');
    document.documentElement.style.setProperty('--stick-top', (h ? h.offsetHeight : 0) + 'px');
    // altura real da doca de abas (celular): a barra da venda fica logo acima dela, sem número fixo
    var tb = document.querySelector('header .tabbar');
    document.documentElement.style.setProperty('--dock-h', (tb && getComputedStyle(tb).position === 'fixed' ? tb.offsetHeight : 0) + 'px');
  }
  window.addEventListener('resize', syncStickyOffsets);
  window.addEventListener('load', syncStickyOffsets);
  if (window.ResizeObserver) { var hd = document.querySelector('header'), ro = new ResizeObserver(syncStickyOffsets); if (hd) ro.observe(hd); var tbo = document.querySelector('header .tabbar'); if (tbo) ro.observe(tbo); }
  // sem ResizeObserver (navegadores antigos): recalcula ao trocar de aba (a navegação de dia aparece/some)
  else document.querySelectorAll('.tab-btn').forEach(function (b) { b.addEventListener('click', function () { setTimeout(syncStickyOffsets, 0); }); });
  // Atalhos de teclado (balcão com teclado): Alt+1..4 troca de aba; "/" vai para a busca da aba;
  // Ctrl+Enter registra a venda/gasto em andamento. Nada acontece com um aviso (modal) aberto.
  var TABS = ['vendas', 'estoque', 'despesas', 'resumo'];
  document.querySelectorAll('.tab-btn').forEach(function (b) { b.title = 'Alt+' + (TABS.indexOf(b.getAttribute('data-tab')) + 1); });
  document.addEventListener('keydown', function (ev) {
    var m = document.getElementById('modal'); if (m && !m.hidden) return;
    var cm = document.getElementById('cmd'); if (cm && !cm.hidden) return;
    var t = ev.target, typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
    var n = /^Digit[1-4]$/.test(ev.code) ? +ev.code.slice(5) : 0;
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && n) { ev.preventDefault(); var tb = document.querySelector('.tab-btn[data-tab="' + TABS[n - 1] + '"]'); if (tb) tb.click(); return; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') {
      var rb = document.getElementById(currentTab === 'vendas' ? 'registrarBtn' : currentTab === 'despesas' ? 'registrarGastoBtn' : '');
      if (rb && !rb.disabled) { ev.preventDefault(); rb.click(); }
      return;
    }
    if (ev.key === '/' && !typing && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      var se = document.getElementById(currentTab === 'vendas' ? 'histSearch' : currentTab === 'estoque' ? 'estSearch' : '');
      if (se) { ev.preventDefault(); se.focus(); se.select(); }
    }
  });
  /* ----- Balcão de comandos (Ctrl+K) -----
     (Fase 8, mantido na consolidação.) Um lugar só para: abrir uma data em português ("ontem", "sexta", "15/9"), pôr um produto ou chave na venda,
     procurar vendas, abrir o fiado de um nome, trocar de aba, tema e backup. Só lê os dados; quem grava continua
     sendo o fluxo normal (adicionar à venda não registra nada). */
  var WDAYS = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
  function parseDataPt(q) {
    var t = norm(q).trim(), hoje = todayKey(); if (!t) return null;
    if (t === 'hoje') return hoje; if (t === 'ontem') return addDays(hoje, -1); if (t === 'anteontem') return addDays(hoje, -2);
    var w = WDAYS.findIndex(function (d) { return t.length >= 3 && d.indexOf(t.replace(/-feira$/, '')) === 0; });
    if (w > -1) { var dw = parseDay(hoje).getDay(), back = (dw - w + 7) % 7 || 7; return addDays(hoje, -back); }
    var m = t.match(/^(\d{1,2})(?:[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?)?$/); if (!m) return null;
    var d = +m[1], mo = m[2] ? +m[2] : +hoje.slice(5, 7), y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : +hoje.slice(0, 4);
    var dt = new Date(y, mo - 1, d); if (dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    if (!m[3] && dayKey(dt) > hoje) dt = new Date(y - 1, mo - 1, d); // "25/12" no começo do ano = o último 25/12
    var k = dayKey(dt); return k > hoje ? null : k;
  }
  var cmdItems = [], cmdSel = 0;
  function irAba(t) { currentTab = t; renderApp(); }
  function cmdBuild(q) {
    var out = [], nq = norm(q).trim(), has = function (s) { return !nq || norm(s).indexOf(nq) > -1; };
    var add = function (sec, ic, label, meta, run) { out.push({ sec: sec, ic: ic, label: label, meta: meta || '', run: run }); };
    var dk = parseDataPt(q);
    if (dk) add('Data', '◷', 'Abrir ' + fmtDayLong(dk), brl(dayTotalOf(dk)), function () { currentTab = currentTab === 'despesas' ? 'despesas' : 'vendas'; goToDay(dk); window.scrollTo(0, 0); });
    [['vendas', 'Vendas'], ['estoque', 'Estoque'], ['despesas', 'Gastos'], ['resumo', 'Resumo']].forEach(function (a) { if (has(a[1]) || (nq && has('ir para ' + a[1]))) add('Ir para', '→', a[1], 'Alt+' + (TABS.indexOf(a[0]) + 1), function () { irAba(a[0]); }); });
    if (nq) {
      var cpk = cloneProd();
      if (cpk && has('Controle clonável')) add('Pôr na venda', '+', 'Controle clonável', brl(PRECO_CLONAVEL) + ' · ' + availQty(cpk) + ' un.', function () { var s = stockItems[cpk.id]; if ((s ? s.qty : 0) < availQty(cpk)) addStockItem(cpk); else showToast('Controle clonável: sem unidades disponíveis no estoque', false, true); irAba('vendas'); });
      ['simples', 'tetra', 'moto', 'carro'].forEach(function (id) { var c = CATEGORIES.find(function (x) { return x.id === id; }); if (has(c.label)) add('Pôr na venda', '+', c.label, c.price ? brl(c.price) : 'valor a informar', function () { itemState[id].qty += 1; irAba('vendas'); }); });
      (searchProducts(q, null, true) || []).filter(function (x) { return !cpk || x.id !== cpk.id; }).slice(0, 6).forEach(function (x) { add('Pôr na venda', '+', pname(x), (prodPrice(x) > 0 ? brl(prodPrice(x)) : 'sem preço') + ' · ' + x.qty + ' un.', function () { addStockItem(x); irAba('vendas'); }); });
      var grupos = {}; salesIndex().fiado.forEach(function (v) { var n = (v.cliente || '').trim(); if (!n || norm(n).indexOf(nq) < 0) return; var g = grupos[norm(n)] || (grupos[norm(n)] = { nome: n, n: 0, t: 0 }); g.n++; g.t = money(g.t + saldoFiado(v)); });
      Object.keys(grupos).slice(0, 4).forEach(function (k) { var g = grupos[k]; add('Fiado', '✎', 'Fiado com o nome “' + g.nome + '”', g.n + (g.n === 1 ? ' venda · ' : ' vendas · ') + brl(g.t), function () { irAba('resumo'); var c = document.querySelector('#resumoContent [data-fiado-total]'); if (c) c.scrollIntoView({ block: 'start' }); }); });
      add('Vendas', '⌕', 'Procurar vendas com “' + q.trim() + '”', 'histórico', function () { irAba('vendas'); var h = document.getElementById('histSearch'); h.value = q.trim(); renderHistoryAndTotal(); document.getElementById('histArea').scrollIntoView({ block: 'start' }); });
    }
    var acoes = [['Nova venda', function () { irAba('vendas'); var w = document.getElementById('saleFormWrap'); if (w) w.scrollIntoView({ block: 'start' }); }],
      ['Novo gasto', function () { irAba('despesas'); var d = document.getElementById('expDesc'); if (d) d.focus(); }],
      ['Novo produto', function () { estUi.form = 'new'; estUi.pre = null; irAba('estoque'); }],
      ['Salvar backup agora', function () { fazerBackup(); }],
      ['Compartilhar resumo do dia (WhatsApp)', function () { abreWhats(msgResumoDia(viewDay), 'Resumo do dia pronto — escolha o contato no WhatsApp (texto copiado)'); }],
      ['Tema: ' + temaProx().label, function () { trocarTema(); }]];
    acoes.forEach(function (a) { if (has(a[0])) add('Ações', '•', a[0], '', a[1]); });
    return out;
  }
  function cmdRender() {
    var ul = document.getElementById('cmdList'), sec = '', h = '';
    if (!cmdItems.length) { ul.innerHTML = '<li class="cmd-empty" role="presentation">Nada encontrado. Tente um produto, uma data (ex: 15/9) ou um nome.</li>'; return; }
    cmdItems.forEach(function (it, i) {
      if (it.sec !== sec) { sec = it.sec; h += '<li class="cmd-sec" role="presentation">' + escAttr(sec) + '</li>'; }
      h += '<li class="cmd-it" role="option" id="cmd-o' + i + '" data-i="' + i + '" aria-selected="' + (i === cmdSel) + '"><span class="ci" aria-hidden="true">' + it.ic + '</span><span>' + escAttr(it.label) + '</span><span class="cm">' + escAttr(it.meta) + '</span></li>';
    });
    ul.innerHTML = h;
    document.getElementById('cmdIn').setAttribute('aria-activedescendant', 'cmd-o' + cmdSel);
    var s = document.getElementById('cmd-o' + cmdSel); if (s) s.scrollIntoView({ block: 'nearest' });
  }
  function cmdRefresh() { cmdItems = cmdBuild(document.getElementById('cmdIn').value); cmdSel = 0; cmdRender(); }
  var cmdVoltar = null;
  function cmdAbrir() { var c = document.getElementById('cmd'); cmdVoltar = document.activeElement; c.hidden = false; var i = document.getElementById('cmdIn'); i.value = ''; cmdRefresh(); i.focus(); }
  function cmdFechar(devolver) { document.getElementById('cmd').hidden = true; if (devolver && cmdVoltar && cmdVoltar.focus) cmdVoltar.focus(); }
  function cmdExec(i) { var it = cmdItems[i]; if (!it) return; cmdFechar(false); it.run(); }
  (function () {
    var c = document.getElementById('cmd'), inp = document.getElementById('cmdIn'), ul = document.getElementById('cmdList');
    document.getElementById('cmdBtn').addEventListener('click', cmdAbrir);
    inp.addEventListener('input', cmdRefresh);
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); if (cmdItems.length) { cmdSel = (cmdSel + (ev.key === 'ArrowDown' ? 1 : -1) + cmdItems.length) % cmdItems.length; cmdRender(); } }
      else if (ev.key === 'Enter') { ev.preventDefault(); cmdExec(cmdSel); }
      else if (ev.key === 'Escape') { ev.preventDefault(); cmdFechar(true); }
      else if (ev.key === 'Tab') ev.preventDefault(); // o foco fica no campo; a lista é escolhida com as setas
    });
    ul.addEventListener('mousemove', function (ev) { var li = ev.target.closest('[data-i]'); if (li && +li.getAttribute('data-i') !== cmdSel) { cmdSel = +li.getAttribute('data-i'); cmdRender(); } });
    ul.addEventListener('click', function (ev) { var li = ev.target.closest('[data-i]'); if (li) cmdExec(+li.getAttribute('data-i')); });
    c.addEventListener('mousedown', function (ev) { if (ev.target === c) cmdFechar(true); });
    document.addEventListener('keydown', function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && (ev.key === 'k' || ev.key === 'K')) {
        var m = document.getElementById('modal'); if (m && !m.hidden) return;
        ev.preventDefault(); if (c.hidden) cmdAbrir(); else cmdFechar(true);
      }
    });
  })();
  // Tema: automático (segue o sistema) → claro → escuro. Guardado junto das preferências de tela.
  var TEMAS = [{ v: '', label: 'automático', ic: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16z" fill="currentColor"/>' }, { v: 'light', label: 'claro', ic: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>' }, { v: 'dark', label: 'escuro', ic: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>' }];
  function temaAtual() { return TEMAS.find(function (t) { return t.v === (groupOpen._theme || ''); }) || TEMAS[0]; }
  function temaProx() { return TEMAS[(TEMAS.indexOf(temaAtual()) + 1) % TEMAS.length]; }
  function aplicarTema() {
    var t = temaAtual(); if (t.v) document.documentElement.setAttribute('data-theme', t.v); else document.documentElement.removeAttribute('data-theme');
    var b = document.getElementById('themeBtn'); if (b) { b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + t.ic + '</svg>'; b.setAttribute('aria-label', 'Tema ' + t.label + ' (tocar muda para ' + temaProx().label + ')'); b.title = 'Tema: ' + t.label; }
  }
  function trocarTema() { var p = temaProx(); if (p.v) groupOpen._theme = p.v; else delete groupOpen._theme; saveUi(); aplicarTema(); showToast('Tema ' + temaAtual().label); }
  document.getElementById('themeBtn').addEventListener('click', trocarTema);
  // Esconder valores (G): só na tela deste navegador; o carrinho da venda continua visível para o cliente.
  function aplicaOculto() {
    var on = lsGet('chaveiro_oculto_v1') === '1', b = document.getElementById('hideBtn');
    document.body.classList.toggle('oculto', on);
    if (b) { b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.setAttribute('aria-label', on ? 'Mostrar valores' : 'Esconder valores da tela'); b.title = on ? 'Mostrar valores' : 'Esconder valores (para o cliente não ver o faturamento)';
      b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (on ? '<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>' : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>') + '</svg>'; }
  }
  document.getElementById('hideBtn').addEventListener('click', function () {
    var on = lsGet('chaveiro_oculto_v1') !== '1';
    try { localStorage.setItem('chaveiro_oculto_v1', on ? '1' : '0'); } catch (e) {}
    aplicaOculto(); showToast(on ? 'Valores escondidos. Toque no olho de novo para mostrar.' : 'Valores visíveis');
  });
  aplicaOculto();
  aplicarTema();
  // Seletores de dia/mês também pelo teclado (Enter/Espaço).
  ['dateBtn', 'monthBtn'].forEach(function (id) { var el = document.getElementById(id); if (el) el.addEventListener('keydown', function (ev) { if (ev.target === el && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); el.click(); } }); });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  function iniciar() {
    if (cfgGet('ocultoInicio', false)) { try { localStorage.setItem('chaveiro_oculto_v1', '1'); } catch (e) {} aplicaOculto(); } // ajuste "abrir com os valores escondidos"
    renderApp(); syncStickyOffsets(); initFile();
  }
  if (ampPrecisaCarregar()) ampCarrega().then(iniciar, iniciar); else iniciar();
})();
